name: Sonic Team
description: >
  A Japanese video game development division of Sega, best known for creating
  the Sonic the Hedgehog series. Founded in 1990 by Yuji Naka, Naoto Ohshima, and
  Hirokazu Yasuhara, it has also developed other acclaimed titles such as NiGHTS
  into Dreams and Phantasy Star Online.
released: 1990
wikipedia: https://en.wikipedia.org/wiki/Sonic_Team
website: https://sonic.sega.jp/SonicTeam/
