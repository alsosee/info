name: Dallas, Season 2
description: >
  The world's first mega-soap, and one of the most popular ever produced,
  Dallas had it all. Beautiful women, expensive cars, and men playing Monopoly
  with real buildings. Famous for one of the best cliffhangers in TV history,
  as the world asked "Who shot J.R.?" A slow-burner to begin with, Dallas hit
  its stride in the 2nd season, with long storylines and expert character
  development. Dallas ruled the airwaves in the 1980's.
