name: "The Office, Season 8"
series: The Office
previous: Shows/2010/The Office, Season 7
description: >
  The eighth season largely centers around Andy Bernard's ascension to regional manager, as
  well as the antics of Robert California, the new CEO of Sabre, a fictional printer company
  that owns Dunder Mifflin. Halfway through the season, Dwight Schrute, along with Jim
  Halpert, Stanley Hudson, Ryan Howard, Erin Hannon, and Cathy, travels to Florida to help set
  up a Sabre Store, where Nellie Bertram is introduced.
