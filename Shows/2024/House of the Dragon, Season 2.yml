episodes:
  - name: A Son for a Son
    description: >
      While Rhaenyra struggles to come to terms with her son's murder, in King's
      Landing, Alicent grows concerned that Aegon's Small Council may lead them to
      an all-out war. Larys suggests Aegon needs a new Hand, and Rhaenyra arrives
      at a fateful decision.
    released: 2024-06-16
    length: 63m
  - name: Rhaenyra the Cruel
    description: >
      As Otto schemes to turn the public against her, Rhaenyra questions Daemon's
      loyalty. Meanwhile, Ser Criston Cole concocts a misguided plan for revenge.
    released: 2024-06-23
    length: 69m
  - name: The Burning Mill
    description: >
      As ancient grudges resurface, Rhaenys suggests that Alicent may see reason
      while the men around her seek bloodshed. Ser Criston proposes a bold scheme.
      Daemon arrives at Harrenhal to raise an army for the Blacks.
    released: 2024-06-30
    length: 71m
  - name: The Red Dragon and the Gold
    description: >
      In Rhaenyra's absence and with no word from Daemon at Harrenhal, Rhaenys
      tries to keep the peace on the Black Council as Cole mounts a campaign into
      the Crownlands. In King's Landing, Aemond continues to undermine Aegon's
      fragile hold on authority.
    released: 2024-07-07
    length: 60m
  - name: Regent
    description: >
      Amid whispers of bad omens, the Greens consider how to fill a void on Aegon's
      Council, Jacaerys sets out on a rogue mission to strike a deal, and Daemon
      enlists Lord Willem Blackwood to help persuade the Brackens to bend the knee.
    released: 2024-07-14
    length: 68m
  - name: Smallfolk
    description: >
      With few options left, Rhaenyra summons a trusted knight for a risky venture
      and plots with Mysaria to catalyze the smallfolk. Meanwhile, Daemon's unease
      grows, and Aemond takes steps to reshape the Green Council.
    released: 2024-07-21
    length: 70m
  - name: The Red Sowing
    description: >
      As Rhaenyra looks to gain an advantage by unusual means, Daemon pressures a
      young liege lord to raise up his bannermen.
    released: 2024-07-28
    length: 67m
  - name: The Queen Who Ever Was
    description: >
      As Aemond becomes more volatile, Larys plots an escape, and Alicent grows
      more concerned about Helaena's safety. Flush with new power, Rhaenyra looks
      to press her advantage.
    released: 2024-08-04
    length: 73m
