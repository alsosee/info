name: Squid Game, Season 2
description: >
  Three years after winning Squid Game, Player 456 remains determined to find
  the people behind the game and put an end to their vicious sport. Using this
  fortune to fund his search, Ki Hoon starts with the most obvious of places:
  look for the man in a sharp suit playing ddakji in the subway. But when his
  efforts finally yield results, the path toward taking down the organization
  proves to be deadlier than he imagined: to end the game, he needs to re-enter
  it.
