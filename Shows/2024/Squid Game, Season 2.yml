episodes:
  - name: Bread and Lottery
    description: >
      A vengeful Gi-hun makes a U-turn at the airport. Later, in his hideout, he
      intensifies his search for the elusive recruiter who is seeking new players.
    released: 2024-12-26
    length: 65m
  - name: Halloween Party
    description: >
      Gi-hun finally gets hold of an invitation, marked for Halloween day. In a
      tense moment facing Jun-ho, they reveal their truths to each other.
    released: 2024-12-26
    length: 52m
  - name: 001
    description: >
      New players gather for a chance to win 45.6 billion won. After an intense
      first round, the survivors' fates hang in the balance - down to one final
      vote.
    released: 2024-12-26
    length: 62m
  - name: Six Legs
    description: >
      The players prepare for the next game: a six-legged pentathlon, where each
      team member must clear a mini-game to survive - or face collective
      elimination.
    released: 2024-12-26
    length: 63m
  - name: One More Game
    description: >
      Kang No-eul earns enemies for her unruly actions. Nerves fray to the breaking
      point as the remaining players vote on whether to move to the next round.
    released: 2024-12-26
    length: 76m
  - name: O  X
    description: >
      Jun-ho and his team prepare to infiltrate a suspicious island. As monetary
      stakes and tensions rise, players split into two opposing factions.
    released: 2024-12-26
    length: 52m
  - name: Friend or Foe
    description: >
      The remaining players strategize on how to survive the night. Gi-hun proposes
      a risky plan - but he will need trustworthy allies to carry it out.
    released: 2024-12-26
    length: 60m
