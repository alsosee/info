episodes:
  - name: Anjin
    description: >
      Destinies converge in Japan after a barbarian ship washes ashore in a poor
      fishing village.
    released: 2024-02-27
    length: 70m
  - name: Servants of Two Masters
    description: Blackthorne's arrival in Osaka stirs up a hornet's nest of rivalries.
    released: 2024-02-27
    length: 58m
  - name: Tomorrow Is Tomorrow
    description: >
      After Blackthorne survives a brazen assassination attempt, Toranaga realizes
      he must ferry his allies out of Osaka or risk certain defeat.
    released: 2024-03-05
    length: 53m
  - name: The Eightfold Fence
    description: >
      Blackthorne and Mariko test their new alliance as they train Toranaga's gun
      regiment for war.
    released: 2024-03-12
    length: 56m
  - name: Broken to the Fist
    description: >
      Blackthorne and Mariko struggle to contain the secret that could get them
      both killed.
    released: 2024-03-19
    length: 57m
  - name: Ladies of the Willow World
    description: >
      Lady Ochiba returns to Osaka in order to accelerate the Regents' campaign
      against Toranaga.
    released: 2024-03-26
    length: 57m
  - name: A Stick of Time
    description: >
      Outplayed by new alliances in Osaka, Toranaga is forced to carve out a new
      deal with a long lost family member.
    released: 2024-04-02
    length: 54m
  - name: The Abyss of Life
    description: Toranaga's defeated clan moves to Edo and awaits their fate.
    released: 2024-04-09
    length: 58m
  - name: Crimson Sky
    description: >
      Mariko arrives in Osaka for the fight of her life. Blackthorne and Yabushige
      scramble to save their own heads as their options dwindle.
    released: 2024-04-16
    length: 60m
  - name: A Dream of a Dream
    description: >
      In the wake of a tragic death, Blackthorne finally considers the true nature
      of Toranaga's plan.
    released: 2024-04-23
    length: 62m
