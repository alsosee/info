name: Shōgun
description: >
  Based on James Clavell's novel, FX's Shōgun is set in Japan in the year 1600
  at the dawn of a century-defining civil war. Lord Yoshii Toranaga is fighting
  for his life as his enemies on the Council of Regents unite against him, when
  a mysterious European ship is found marooned in a nearby fishing village.
released: 2024-02-27
rating: TV-MA
genres:
  - drama
  - adventure
  - historical drama
network: FX
wikipedia: https://en.wikipedia.org/wiki/Sh%C5%8Dgun_(2024_TV_series)
imdb: https://www.imdb.com/title/tt2788316
