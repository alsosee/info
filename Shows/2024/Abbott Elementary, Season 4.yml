name: Abbott Elementary, Season 4
description: >
  In this workplace comedy, a group of dedicated, passionate teachers - and a
  slightly tone-deaf principal - are brought together in a Philadelphia public
  school where, despite the odds stacked against them, they are determined to
  help their students succeed in life. Though these incredible public servants
  may be outnumbered and underfunded, they love what they do - even if they
  don't love the school district's less-than-stellar attitude toward educating
  children.
