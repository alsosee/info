episodes:
  - name: Back to School
    description: >
      The neighboring construction site of a new golf course causes issues at
      Abbott, forcing the teachers to find creative solutions; an HR representative
      visits the school; following their kiss, Janine and Gregory's relationship
      status is revealed.
    released: 2024-10-09
    length: 32m
  - name: Ringworm
    description: >
      When it's revealed that a student in Jacob's class has ringworm, the faculty
      must band together to stop it from spreading through the entire school.
    released: 2024-10-16
    length: 30m
  - name: Class Pet
    description: >
      Janine gets a budget for class pets, but Melissa is resistant to taking on
      the added work and responsibility for her room's guinea pig; an IT rep from
      the school district arrives to set up new computers.
    released: 2024-10-23
    length: 32m
  - name: Costume Contest
    description: >
      It's Halloween at Abbott Elementary and Janine and Gregory proudly show off
      their couple's costume, but it fails to translate; Barbara faces pushback
      from parents concerned about hygiene and her beloved apple-bobbing tradition.
    released: 2024-10-30
    length: 32m
  - name: Dad Fight
    description: >
      Gregory forms a bond with one of his students, but the student's dad becomes
      jealous of their relationship and seeks a confrontation; Melissa suffers a
      fall but avoids receiving medical attention for the injury.
    released: 2024-11-06
    length: 32m
  - name: The Deli
    description: >
      When the neighborhood deli is forced to close to make room for a trendy
      smoothie place, Melissa, Barbara and Jacob team up to fight the
      gentrification; the district asks Ava to give a presentation to fellow
      principals.
    released: 2024-11-13
    length: 32m
  - name: Winter Show
    description: >
      Despite a few setbacks, Barbara is determined to make Abbott Elementary's
      first-ever holiday show a success; Jacob's brother arrives for his visit
      earlier than planned.
    released: 2024-12-04
    length: 31m
  - name: Winter Break
    description: >
      Melissa hosts the Schemmenti family Christmas Eve dinner and goes to great
      lengths to make sure everything is perfect; Janine and Gregory get an
      unexpected guest.
    released: 2024-12-04
    length: 31m
  - name: Volunteers
    description: >
      Ava announces the school district is sending a group of volunteers to help
      out at Abbott; however, when they arrive, things don't go as planned.
    released: 2025-01-08
    length: 32m
  - name: Testing
    description: >
      Janine must rethink her lesson plans after her class performs poorly on a
      practice test; Jacob struggles to engage a disinterested student; the
      district sends a new custodian to train under Mr. Johnson.
    released: 2025-01-15
    length: 32m
  - name: Strike
    description: >
      When city buses stop running due to a strike, resulting in many students
      being absent from school, the teachers at Abbott try to find creative
      solutions and adapt to hybrid learning; Gregory and O'Shon strike up a
      friendship.
    released: 2025-01-22
    length: 32m
  - name: Girard Creek
    description: >
      The Abbott Elementary students and staff are invited to a special grand
      opening preview of the Girard Creek Golf Club.
    released: 2025-01-29
    length: 32m
  - name: Science Fair
    description: >
      While supervising the kids making their science fair projects, the teachers'
      competitive sides come out.
    released: 2025-02-05
    length: 32m
  - name: District Budget Meeting
    description: >
      Ava and the Abbott teachers plan for the annual school district budget
      meeting; Janine and Gregory prepare for Valentine's Day as a couple.
    released: 2025-02-12
    length: 32m
  - name: 100th Day of School
    description: >
      During Abbott's 100th day of school celebrations, Barbara receives a surprise
      from her daughter; Jacob and Mr. Johnson join forces to conduct a search
      party.
    released: 2025-02-26
    length: 32m
  - name: Books
    description: >
      A debate over a controversial book leads Ava to remove it from the library,
      but some parents push for its return.
    released: 2025-03-05
    length: 32m
  - name: Karaoke
    description: >
      When the teachers hit a karaoke bar for a night of fun, Jacob bumps into an
      old friend.
    released: 2025-03-12
    length: 32m
  - name: Audit
    description: Ava and the teachers must band together to hide the golf-course contraband.
    released: 2025-03-19
    length: 32m
  - name: Music Class
    description: >
      Barbara and Gregory are in over their heads when they find themselves in new
      roles at Abbott Elementary.
    released: 2025-03-26
    length: 32m
  - name: "Ava Fest: Tokyo Drift"
    description: >
      The Abbott teachers turn their open house into a car wash to help raise money
      for the school.
    released: 2025-04-02
    length: 32m
  - name: Rally
    description: >
      Ava and the Abbott teachers go to the district to plead for Ava's job back;
      Gregory handles duties as interim principal.
    released: 2025-04-09
    length: 32m
  - name: Please Touch Museum
    description: >
      Abbott Elementary goes on a schoolwide field trip to the Please Touch Museum,
      which has some of the older kids skeptical.
    released: 2025-04-16
    length: 32m
