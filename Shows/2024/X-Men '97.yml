name: "X-Men '97"
description: >
  A revival and continuation of X-Men: The Animated Series, following the X-Men
  after Professor Xavier's departure from Earth. In the first season, the team
  faces new uncertainty under Magneto's leadership while a renewed Sentinel
  threat builds against mutantkind.
