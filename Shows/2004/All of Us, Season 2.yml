  Season 2 continues All of Us with episodes beginning with "Reunited and It Doesn't
  Feel That Good".
previous: Shows/2003/All of Us
released: 2004-09-21
rating: TV-PG
genres:
  - comedy
network: The CW
wikipedia: https://en.wikipedia.org/wiki/All_of_Us
imdb: https://www.imdb.com/title/tt0362404/episodes?season=2
tmdb: https://www.themoviedb.org/tv/1566/season/2
creators:
  - Jada Pinkett Smith
  - Will Smith
  - Betsy Borns
characters:
  - name: Robert James
    actor: Duane Martin
  - name: Neesee James
    actor: LisaRaye McCoy
  - name: Robert "Bobby" James, Jr.
    actor: Khamani Griffin
  - name: Dirk Black
    actor: Tony Rock
  - name: Tia Jewel
    actor: Elise Neal
episodes:
  - name: Reunited and It Doesn't Feel That Good
    description: >
      Robert is disappointed when a night of passion does not change things with Tia; Neesee
      tries to bring the lovers together, only to learn that she is the reason for their
      separation.
    released: 2004-09-21
    length: 30m
  - name: Return of the Mack
    description: >
      Robert realizes his grief is rubbing off on Bobby Jr., so he decides to break out of
      his depression and teach him a few things about women.
    released: 2004-09-28
    length: 30m
  - name: The Kiss Off
    description: >
      Robert tries to keep tabs on Tia during her date with a flirty firefighter, but he
      gets more than he bargained for when he learns she kissed the guy.
    released: 2004-10-05
    length: 30m
  - name: In Through the Out Door
    description: >
      When Neesee nurses an ailing Robert and Bobby Jr.
    released: 2004-10-12
    length: 30m
  - name: Let's Stay Together
    description: >
      Tia and Robert create a scene at Dirk and Jonelle's wedding when Tia rebuffs Robert
      for almost kissing Neesee.
    released: 2004-10-26
    length: 30m
  - name: Why Do Fools Fall Back In Love?
    description: >
      Robert and Nessee have dinner to discuss the romantic spark between them, but it turns
      catty as old habits resurface reminding them of why they got divorced in the first
      place.
    released: 2004-10-19
    length: 30m
  - name: Basket Cases
    description: >
      Neesee invites the gang to luxury box seats at a basketball game, but panic sets in
      when Bobby disappears.
    released: 2004-11-09
    length: 30m
  - name: Parents Just Don't Understand
    description: >
      Neesee's mother and Tia's father visit for Thanksgiving dinner.
    released: 2004-11-23
    length: 30m
  - name: The Return of Mars Blackmon
    description: >
      Robert coaches a game in which he is forced to deal with a boisterous heckling father,
      but he turns the other cheek in order to teach Bobby a lesson.
    released: 2004-11-30
    length: 30m
  - name: Home for Christmas?
    description: >
      A snowstorm forces Robert off the road on his way to an interview in New York and
      jeopardizes his chances of spending Christmas with Bobby and Tia.
    released: 2004-12-14
    length: 30m
  - name: Liar, Liar
    description: >
      Robert, Neesee and Tia disagree on how to deal with Bobby when he is caught lying.
    released: 2005-01-04
    length: 30m
  - name: Get Me to the Church on Time
    description: >
      Frankie, an old friend, returns to town as a minister, causing Robert and Neesee to
      re-evaluate their lives and make some changes.
    released: 2005-01-11
    length: 30m
  - name: Focus
    description: >
      Robert refuses to accept that Bobby has ADD and tries to cure him without therapy.
    released: 2005-02-08
    length: 30m
  - name: Not So Wonderful News
    description: >
      Robert's romantic New York weekend with Tia goes awry when his interview with Serena
      Williams keeps getting rescheduled by her wacky assistant.
    released: 2005-02-15
    length: 30m
  - name: Handle Your Business
    description: >
      When Jonelle throws Dirk out, he goes to stay at Robert and Tia's house causing them
      to become involved in his breakup.
    released: 2005-02-22
    length: 30m
  - name: So I Creep
    description: >
      Robert gets a job on "Entertainment Tonight" and insists that Dirk be his producer,
      but when he criticizes the stories they give Robert, Dirk quits.
    released: 2005-03-01
    length: 30m
  - name: Movin' On Up
    description: >
      Robert struggles to balance two television jobs and must choose between his local show
      and a national entertainment opportunity.
    released: 2005-03-29
    length: 30m
  - name: Passing the Test
    description: >
      While celebrating Neesee's birthday at her apartment, Robert and Tia find a pregnancy
      test and believe Neesee is pregnant.
    released: 2005-04-19
    length: 30m
  - name: Baby Got (Flash) Back
    description: >
      Robert, Tia, Neesee and Bobby each fantasize how their lives will be affected by
      Robert and Tia's marriage.
    released: 2005-04-26
    length: 30m
  - name: Hollywood Swinging
    description: >
      When Robert starts to get some attention as a correspondent for "Entertainment
      Tonight," his status and swelling ego begin to wear on his friends.
    released: 2005-05-03
    length: 30m
  - name: Sail On
    description: >
      When Robert accepts an offer from his boss to pay for his wedding and for the right to
      televise it, Tia regrets the decision when advertising and promotions overshadow the
      bride and groom.
    released: 2005-05-10
    length: 30m
  - name: He-Male Trouble
    description: >
      Robert faces a major career decision while Tia learns something life-altering; Neely
      is not sure she wants to take her relationship with Rusty to the next level.
    released: 2005-05-24
    length: 30m
