name: Smallville, Season 4
description: >
  Clark Kent will have plenty of reasons to remember his senior year! The thrilling
  reinterpretation of the Superman legend evolves in Season 4, including the quest for 3
  Kryptonian crystals... and Clark's bold attempt to keep those mysterious stones from
  destroying Earth. Clark also becomes a highly recruited football star. Lana Lang
  embarks on a new romance and Lois Lane - smart, opinionated and entirely annoying to
  Clark - comes to Smallville.
