name: Squid Game, Season 3
description: >
  A failed rebellion, the death of a friend, and a secret betrayal. Picking up
  in the aftermath of Season 2's bloody cliffhanger, the third and final season
  of Netflix's most popular series finds Gi-hun, a.k.a. Player 456, at his
  lowest point yet. But the Squid Game stops for no one, so Gi-hun will be
  forced to make some important choices in the face of overwhelming despair as
  he and the surviving players are thrust into deadlier games that test
  everyone's resolve. With each round, their choices lead to increasingly grave
  consequences. Meanwhile, In-ho resumes his role as Front Man to welcome the
  mysterious VIPs, and his brother Jun-ho continues his search for the elusive
  island, unaware there's a traitor in their midst. Will Gi-hun make the right
  decisions, or will Front Man finally break his spirit?
