name: The Handmaid's Tale, Season 6
description: >
  June's unyielding spirit and determination pull her back into the fight to
  take down Gilead. Luke and Moira join the resistance. Serena tries to reform
  Gilead while Commander Lawrence and Aunt Lydia reckon with what they have
  wrought, and Nick faces challenging tests of character. This final chapter of
  June's journey highlights the importance of hope, courage, solidarity, and
  resilience in the pursuit of justice and freedom.
