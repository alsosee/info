  - name: Same Spirits, New Forms
    description: >
      As a new round of guests arrives at the White Lotus Thailand, Belinda settles
      in, Chelsea deals with a moody Rick, the Ratliffs go separate ways, and Kate,
      Laurie, and Jaclyn kick off a girls' trip.
    released: 2025-02-16
    length: 62m
