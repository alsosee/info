    length: 63m
  - name: The Meaning of Dreams
    description: >
      Jaclyn pushes the idea of a vacation fling on Laurie. Chelsea finds herself
      in a perilous situation. Gaitok worries about a reprimand.
    released: 2025-03-02
    length: 60m
  - name: Hide or Seek
    description: >
      Jaclyn looks for a different scene. Piper asks for Lochlan's support before
      sharing a life update. Chelsea finally gets Rick to open up.
    released: 2025-03-09
    length: 62m
  - name: Full-Moon Party
    description: >
      As things get wild during the Full Moon festivities, Rick visits an old
      friend, and Belinda shares her suspicions about a hotel guest.
    released: 2025-03-16
    length: 62m
  - name: Denials
    description: >
      In the wake of the festivities, Laurie finds herself feeling deceived by
