name: The Girlfriend
description: >
  Laura Sanderson's carefully ordered life begins to unravel when her son
  Daniel brings home Cherry, a new girlfriend Laura suspects of hiding dangerous
  motives. The psychological thriller follows Laura and Cherry's escalating
  struggle over Daniel through competing perspectives.
