episodes:
  - name: Episode 1
    description: >
      Laura meets Daniel's new girlfriend Cherry and begins to question whether
      her charm is masking something more calculated.
    released: 2025-09-10
    directors: Robin Wright
    writers:
      - Naomi Sheldon
      - Gabbie Asher
  - name: Episode 2
    description: >
      Daniel brings Cherry on a family holiday in Spain, where class tensions
      and conflicting impressions deepen Laura's unease.
    released: 2025-09-10
    directors: Robin Wright
    writers:
      - Marek Horn
      - Polly Cavendish
  - name: Episode 3
    description: >
      Laura looks into Cherry's past as Daniel plans a future with her and the
      rivalry between the two women intensifies.
    released: 2025-09-10
    directors: Robin Wright
    writers:
      - Ava Wong Davies
      - Polly Cavendish
  - name: Episode 4
    description: >
      After a crisis separates Daniel and Cherry, Laura tries to control what
      each of them knows while Cherry searches for answers.
    released: 2025-09-10
    directors: Andrea Harkin
    writers:
      - Isis Davis
      - Smita Bhide
  - name: Episode 5
    description: >
      Laura's deception damages her bond with Daniel as Cherry presses forward
      and the conflict spills into Laura's professional life.
    released: 2025-09-10
    directors: Andrea Harkin
    writers: Helen Kingston
  - name: Episode 6
    description: >
      Daniel and Cherry prepare for their next step together while Laura makes a
      last attempt to expose what she believes Cherry is hiding.
    released: 2025-09-10
    directors: Andrea Harkin
    writers: Naomi Sheldon
