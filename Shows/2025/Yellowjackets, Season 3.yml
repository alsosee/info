episodes:
  - name: It Girl
    description: >
      Summer inspires the Yellowjackets to ditch soccer for a more
      contact-intensive sport; a funeral flows organically into a bar therapy
      session; Misty dives into a new personality; Tai and Van devote time to
      blurring the lines between ex and girlfriend.
    released: 2025-02-14
    length: 58m
  - name: Dislocation
    description: >
      The Yellowjackets are stuck deciding whether to track down a missing teammate
      or just trip out on mushrooms; Shauna secures a spot on the world's most
      unsupportive partner list; Misty finds herself tangled in the intimate chaos
      of sleepover parties.
    released: 2025-02-14
    length: 57m
  - name: Them's the Brakes
    description: >
      The return of a Yellowjacket sparks a vengeful frenzy in the team; Lottie's
      rendition of "Cool Aunt Without Kids" leaves Callie with an open door to
      answers about her mother's twisted past; Tai and Van receive a karmic payout
      for their dine and dash.
    released: 2025-02-21
    length: 54m
  - name: 12 Angry Girls and 1 Drunk Travis
    description: >
      The Yellowjackets attempt to spin a hundred suspicions into proof. Coach
      Scott has an existential meltdown and wonders if the universe really does
      hate him. Meanwhile, Jeff embarks on a crusade to make things right
      energetically. Shauna is forcibly committed to some me time" and confronts
      the walking disaster she's turned into. Spoiler: it's not a spa day.
    released: 2025-02-28
    length: 58m
  - name: Did Tai Do That?
    description: >
      The Yellowjackets confront the reality of having to pull an Old Yeller;
      Lottie mentors a new up-and-coming prophet; in the present, Misty
      investigates a suspicious death; Shauna, desperate for backup, turns to the
      last person she would trust.
    released: 2025-03-07
    length: 55m
  - name: Thanksgiving (Canada)
    description: >
      The Yellowjackets start turning on each other faster than a reality TV
      reunion special; the Sadecki family vacation features a vending machine and a
      deep dive into questionable parenting choices; Misty uncovers an
      incriminating clue.
    released: 2025-03-14
    length: 53m
  - name: Croak
    description: >
      The Yellowjackets realize their choices have snowballed into a catastrophe.
      Misty sets her sights on a fresh suspect, and even she's surprised by the
      plot twist. Meanwhile, Taissa's desperation is peeling back layers she didn't
      even know she had.
    released: 2025-03-21
    length: 54m
  - name: A Normal, Boring Life
    description: >
      With a possible escape from their nightmare, the Yellowjackets learn not
      everyone may be in a rush to leave; in the present, the unexpected return of
      an old teammate sends Shauna spiraling in ways that should probably concern
      everyone.
    released: 2025-03-28
    length: 55m
  - name: How the Story Ends
    description: >
      Taking cues from Stravinsky (or Picciotto, if that's your vibe), the
      Yellowjackets' rites of spring finally come to an end. Misty gets a pick-me
      up. Shauna worries about a sticky Melissa problem. The power of The New Flesh
      is strong with this one.
    released: 2025-04-04
    length: 55m
  - name: Full Circle
    description: >
      Things turn frigid as bloody new alliances get built and spilled; loyalties
      hit the floor; Misty finally gets some answers; Tai wants to leave nothing to
      chance; Natalie tries living on the edge; Shauna confronts the loneliness of
      real sacrifice.
    released: 2025-04-11
    length: 59m
