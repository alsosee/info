name: Sex and the City, Season 5
description: >
  A candid, comic view of sex and relationships, Sex and the City stars Sarah
  Jessica Parker as Carrie Bradshaw, a New York-based writer who explores and
  experiences the unique world of Manhattan's dating scene, chronicling the
  mating habits of single New Yorkers. Executive produced by Michael Patrick
  King, the series also stars cast regulars Kim Cattrall as PR executive
  Samantha Jones, who's seen -- and done -- it all; Kristin Davis as Charlotte
  York, still trying to hold on to the idea of happily ever after; and Cynthia
  Nixon as corporate lawyer and mother Miranda Hobbes, a pragmatist trying to
  balance the idea of love with the realities of life.
