name: Buffy the Vampire Slayer, Season 7
description: >
  Buffy's resurrection caused an instability which allows The First Evil, a spiritual
  entity that Buffy encountered before, to begin tipping the balance between good and
  evil. It has inactive Potential Slayers hunted and killed by Caleb, a sinister and
  misogynistic preacher turned serial killer who heads a cult called Bringers, who
  worship The First as a god. Inside the Hellmouth it raises an army of Turok-Han, an
  ancient and powerful sub species of vampire.
