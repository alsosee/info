name: The Shield
description: >
  Detective Vic Mackey is the leader of an elite Strike Team unit, a group of
  cops effective at eliminating crime but also operating under Vic's own set of
  rules. But his rules sometimes cross the fine line between legal and illegal.
  Now the precinct has a new captain who doesn't like Vic's tactics and wants
  to bust him off the force - even as the captain finds himself going to Vic
  for help whenever the going gets rough.
released: 2002-03-12
rating: TV-MA
