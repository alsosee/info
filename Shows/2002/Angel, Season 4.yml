name: Angel, Season 4
description: >
  With both Angel and Cordelia still missing, Fred, Gunn and Connor try to keep Angel
  Investigations running while they search for their friends. Ironically, the man who
  everyone believes betrayed Angel is the one who finally comes to Angel's rescue. Then
  Cordelia mysteriously reappears with no memory of her life or her friends. Confused,
  she chooses to take refuge with Connor — setting into motion events that will alter
  their lives forever.
