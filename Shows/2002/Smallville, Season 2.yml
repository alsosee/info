name: Smallville, Season 2
description: >
  Clark Kent lives in Smallville, but in many ways he's out of this world. Clark
  grapples with his true calling. Is he on Earth to serve humanity or perhaps destroy
  it? Lex gets married - twice! Lana moves in with Chloe, adding a new dynamic to their
  Clark dilemma. Martha and Jonathan receive miraculous news. Lionel pulls devious
  strings. And Pete becomes a keeper of the Clark secret. One thing we can't keep
  secret: the legend grows stronger in Smallville!
