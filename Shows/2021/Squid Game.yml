name: Squid Game
description: >
  Hundreds of cash-strapped players accept a strange invitation to compete in
  children's games. Inside, a tempting prize awaits --- with deadly high
  stakes.
released: 2021-09-17
rating: TV-MA
genres:
  - drama
  - thriller
  - mystery
network: Netflix
wikipedia: https://en.wikipedia.org/wiki/Squid_Game
imdb: https://www.imdb.com/title/tt10919420
website: https://www.netflix.com/title/81040344
creators:
  - Hwang Dong-hyuk
characters:
  - name: Sung Gi Hun
    actor: Lee Jung Jae
  - name: Hwang Joon Ho
    actor: Wi Ha Joon
  - name: Front Man
    actor: Lee Byung Hun
  - name: Jo Sang Woo
    actor: Park Hae Soo
  - name: Kang Sae Byuk
    actor: Jung Ho Yun
  - name: Oh Il Nam
    actor: Oh Young Soo
  - name: Lee Myung Gi
    actor: Im Si Wan
  - name: Park Kyung Suk
    actor: Lee Jin Wook
episodes:
  - name: Red Light, Green Light
    description: >
      Hoping to win easy money, a broke and desperate Gi-hun agrees to take part in
      an enigmatic game. Not long into the first round, unforeseen horrors unfold.
    released: 2021-09-17
    length: 60m
  - name: Hell
    description: >
      Split on whether to continue or quit, the group holds a vote. But their
      realities in the outside world may prove to be just as unforgiving as the
      game.
    released: 2021-09-17
    length: 63m
  - name: The Man with the Umbrella
    description: >
      A few players enter the next round - which promises equal doses of sweet and
      deadly - with hidden advantages. Meanwhile, Jun-ho sneaks his way inside.
    released: 2021-09-17
    length: 54m
  - name: Stick to the Team
    description: >
      As alliances form among the players, no one is safe in the dorm after
      lights-out. The third game challenges Gi-hun's team to think strategically.
    released: 2021-09-17
    length: 55m
  - name: A Fair World
    description: >
      Gi-hun and his team take turns keeping guard through the night. The masked
      men encounter trouble with their co-conspirators.
    released: 2021-09-17
    length: 52m
  - name: Gganbu
    description: >
      Players pair off for the fourth game. Gi-hun grapples with a moral dilemma,
      Sang-woo chooses self-preservation and Sae-byeok shares her untold story.
    released: 2021-09-17
    length: 62m
  - name: VIPS
    description: >
      The Masked Leader welcomes VIP guests to the facility for a front-row viewing
      of the show. In the fifth game, some players crack under pressure.
    released: 2021-09-17
    length: 58m
  - name: Front Man
    description: >
      Ahead of the last round, distrust and disgust run deep among the finalists.
      Jun-ho makes a getaway, determined to expose the game's dirty secrets.
    released: 2021-09-17
    length: 32m
  - name: One Lucky Day
    description: >
      The final round presents another cruel test - but this time, how it ends
      depends on just one player. The game's creator steps out of the shadows.
    released: 2021-09-17
    length: 55m
