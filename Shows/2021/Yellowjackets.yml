name: Yellowjackets
description: >
  Wildly talented high school girls' soccer players descend into savage clans
  after their plane crashes in the remote northern wilderness. Twenty-five
  years later, they discover that what began in the wild is far from over.
released: 2021-11-14
rating: TV-MA
genres:
  - drama
  - horror
  - supernatural
network: Showtime
wikipedia: https://en.wikipedia.org/wiki/Yellowjackets_(TV_series)
imdb: https://www.imdb.com/title/tt11041332
website: https://sho.com/yellowjackets
creators:
  - Ashley Lyle
  - Bart Nickerson
characters:
  - name: Adult Taissa Turner
    actor: Tawny Cypress
  - name: Teen Taissa
    actor: Jasmin Savoy Brown
  - name: Teen Natalie
    actor: Sophie Thatcher
  - name: Adult Misty Quigley
    actor: Christina Ricci
  - name: Teen Misty
    actor: Sammi Hanratty
  - name: Teen Lottie Matthews
    actor: Courtney Eaton
  - name: Teen Vanessa 'Van' Palmer
    actor: Liv Hewson
  - name: Adult Shauna Shipman
    actor: Melanie Lynskey
episodes:
  - name: Pilot
    description: >
      On the eve of a fateful flight, a championship high school girls soccer squad
      celebrates being a team by betraying one another. 25 years later, the
      survivors do their best imitations of well-adjusted people.
    released: 2021-11-14
    length: 60m
  - name: F Sharp
    description: >
      As the teens get their bearings among the wreckage, Misty finds hell on earth
      quite becoming. In the present: revenge, sex homework and the policeman
      formerly known as Goth.
    released: 2021-11-21
    length: 60m
  - name: The Dollhouse
    description: >
      The Yellowjackets debate the merits of probably dying while staying put or
      probably dying while looking for shelter. Taissa navigates a dirty attack ad
      and the other C-word. Shauna sees about a boy.
    released: 2021-11-28
    length: 60m
  - name: Bear Down
    description: >
      The girls play with guns to determine who is the most responsible. Natalie
      untangles a lifetime of piecing together broken men. Taissa greets the rich.
    released: 2021-12-05
    length: 60m
  - name: Blood Hive
    description: >
      Out in the wilderness, the girls ride the crimson wave and plan a dark arts
      slumber party. Natalie and Misty tame a stallion. On Halloween night, Shauna
      parties like it's 1996.
    released: 2021-12-12
    length: 60m
  - name: Saints
    description: >
      The Yellowjackets tangle with the birds & the bees, navigating love, lust and
      DIY surgery. In the present : blackmail, bunnies and an icy reunion. Misty
      prepares for a surprise(d) houseguest.
    released: 2021-12-19
    length: 60m
  - name: No Compass
    description: >
      As starvation looms, Taissa leads a last-ditch effort and/or suicide mission.
      Amid felony schemes and all-night stakeouts, the Yellowjackets are forced to
      commit small talk.
    released: 2021-12-26
    length: 60m
  - name: Flight of the Bumblebee
    description: >
      What is madness and what is divine? While in triage after a vicious attack,
      the Yellowjackets are left to suss out the best of their worst ideas. Shauna
      dabbles in some light cyberstalking.
    released: 2022-01-02
    length: 60m
  - name: Doomcoming
    description: >
      You are cordially invited to The Doomcoming. On the brink of death, the
      Yellowjackets opt to throw one last rager before careening into oblivion. An
      increasingly paranoid Shauna struggles between keeping her cool and being
      Shauna.
    released: 2022-01-09
    length: 60m
  - name: Sic Transit Gloria Mundi
    description: >
      On the night of their 25-year class reunion, the Yellowjackets navigate
      damning evidence, false alibis and a dubious attempt to "heal." In the
      wilderness, the Doomcoming fallout finds everything firmly off the rails as
      simmering resentments come to a head.
    released: 2022-01-16
    length: 60m
