name: The White Lotus
description: >
  Set at an exclusive Hawaiian resort, Season 1 of The White Lotus follows the
  vacations of various hotel guests over the span of a week as they relax and
  rejuvenate in paradise. But with each passing day, a darker complexity
  emerges in these picture-perfect travelers, the hotel's cheerful employees
  and the idyllic locale itself.
released: 2021-07-11
rating: TV-MA
genres:
  - drama
  - comedy
  - satire
network: HBO
wikipedia: https://en.wikipedia.org/wiki/The_White_Lotus
