episodes:
  - name: Arrivals
    description: >
      As the White Lotus welcomes their newest guests, tensions quickly arise
      between the hotel staff and the volatile vacationers.
    released: 2021-07-11
    length: 54m
  - name: New Day
    description: >
      Belinda walks a fine line with Tanya. Armond deals with his guilt. Rachel
      seeks advice from Nicole. Mark reconnects with family.
    released: 2021-07-18
    length: 57m
  - name: Mysterious Monkeys
    description: >
      Mark processes revelations about his dad. Armond has a surprise in store for
      Shane. Tanya leans on Belinda for support. Paula has a secret.
    released: 2021-07-25
    length: 59m
  - name: Recentering
    description: >
      Rachel floats a career change to Shane. Belinda starts to take Tanya's
      proposition seriously. Armond's renewed sobriety is put to the test.
    released: 2021-08-01
    length: 59m
  - name: The Lotus-Eaters
    description: >
      Feeling sidelined, Rachel begins to rethink her marriage. Armond attempts
      damage control. Paula becomes disillusioned with the Mossbachers.
    released: 2021-08-08
    length: 61m
  - name: Departures
    description: >
      Rachel reveals stark truths. The Mossbachers turn the page on a traumatic
      event. Belinda gets bad news, and Armond exacts revenge.
    released: 2021-08-15
    length: 66m
