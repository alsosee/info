name: Abbott Elementary
description: >
  In this workplace comedy, a group of dedicated, passionate teachers - and a
  slightly tone-deaf principal - are brought together in a Philadelphia public
  school where, despite the odds stacked against them, they are determined to
  help their students succeed in life. Though these incredible public servants
  may be outnumbered and underfunded, they love what they do - even if they
  don't love the school district's less-than-stellar attitude toward educating
  children.
released: 2021-12-07
rating: TV-PG
genres:
  - comedy
  - mockumentary
  - workplace comedy
network: ABC
wikipedia: https://en.wikipedia.org/wiki/Abbott_Elementary
imdb: https://www.imdb.com/title/tt14218830
website: https://abc.com/shows/abbott-elementary
creators:
  - Quinta Brunson
characters:
  - name: Janine Teagues
    actor: Quinta Brunson
  - name: Gregory Eddie
    actor: Tyler James Williams
  - name: Ava Coleman
    actor: Janelle James
  - name: Jacob Hill
    actor: Chris Perfetti
  - name: Melissa Schemmenti
    actor: Lisa Ann Walter
  - name: Barbara Howard
    actor: Sheryl Lee Ralph
  - name: Mr. Johnson
    actor: William Stanford Davis
episodes:
  - name: Pilot
    description: >
      Passionate teachers -- and a slightly tone-deaf principal -- are determined
      to help their students succeed.
    released: 2021-12-07
    length: 30m
  - name: Light Bulb
    description: >
      Janine takes it upon herself to fix every problem when she notices a flicking
      light bulb in the hallway; Gregory asks Barbara for help talking to a parent,
      which leads him to spend his lunch period in an unexpected way.
    released: 2022-01-04
    length: 30m
  - name: Wishlist
    description: >
      The teachers to ask the local community for new school supplies; Janine
      encourages Gregory to decorate his classroom.
    released: 2022-01-11
    length: 30m
  - name: New Tech
    description: >
      When a new computer program is introduced at Abbott, Janine is excited to
      finally help Barbara with something; Barbara is reluctant to accept change
      and finds herself in a tricky situation; Melissa surprises Jacob.
    released: 2022-01-18
    length: 30m
  - name: Student Transfer
    description: >
      After a negative teacher review, Janine gets a confidence boost when a
      student gets transferred from Melissa's class into hers; Jacob tries to forge
      a friendship with an uninterested Gregory.
    released: 2022-01-25
    length: 30m
  - name: Gifted Program
    description: >
      Janine convinces Ava to start a gifted program at Abbott led by Jacob;
      Barbara pushes a hesitant Melissa to start dating again.
    released: 2022-02-01
    length: 30m
  - name: Art Teacher
    description: >
      Janine is thrilled when her best friend from college is hired as the art
      teacher; Jacob and Barbara decide to start a school garden.
    released: 2022-02-08
    length: 30m
  - name: Work Family
    description: >
      After Jacob reveals a detail about his personal life, Janine realizes she
      doesn't know the other teachers as well as she thought; Gregory's stern
      teaching approach is causing his whole class to underperform.
    released: 2022-02-15
    length: 30m
  - name: Step Class
    description: >
      Ava asks Janine to help her teach the after-school step class, but they don't
      agree on how to run the program; Gregory must reveal a secret when Barbara,
      Melissa and Jacob plan a pizza "eat-off."
    released: 2022-02-22
    length: 30m
  - name: Open House
    description: >
      Janine prepares to meet her struggling student's mother during open house,
      while the rest of the faculty uses the time to relax; Gregory is taken aback
      when he learns how Ava got the principal job; Barbara's daughter's visit
      creates a commotion.
    released: 2022-03-22
    length: 30m
  - name: Desking
    description: >
      When the students start participating in a new online trend that causes
      disruption to the school, the teachers band together to put an end to it; Mr.
      Johnson provides comforting life advice to Gregory; the teachers finally meet
      Jacob's boyfriend.
    released: 2022-03-29
    length: 30m
  - name: Ava vs. Superintendent
    description: >
      With the school board threatening to pull their funds, Janine and Gregory
      decide to help Ava out with her presentation; their plan is derailed when a
      curveball is thrown at Ava; Barbara offends Melissa when she doesn't agree
      with her blackmail idea.
    released: 2022-04-05
    length: 30m
  - name: Zoo Balloon
    description: >
      While on Abbott's annual zoo field trip, Tariq reveals that he has been
      offered a job in New York; Janine struggles with a big choice; Barbara starts
      questioning her future after finding out her favorite tuatara has been
      retired because of old age.
    released: 2022-04-12
    length: 30m
