name: Mister Rogers' Neighborhood, Season 4
description: >
  Award-winning host Fred Rogers visits neighbors and places to help children
  learn about the world around them. He talks with young viewers about their
  feelings as they deal with the challenges and joys of growing and learning.
  These themes are reinforced in the Neighborhood of Make-Believe, where
  puppets and humans work together to solve problems and help each other.
