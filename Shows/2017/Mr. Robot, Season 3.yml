name: Mr. Robot, Season 3
description: >
  Mr. Robot follows Elliot, a young programmer who works as a cyber-security engineer by
  day and as a vigilante hacker by night. Elliot finds himself at a crossroads when the
  mysterious leader of an underground hacker group recruits him to destroy the firm he
  is paid to protect. Compelled by his personal beliefs, Elliot struggles to resist the
  chance to take down the multinational CEOs he believes are running (and ruining) the
  world.
