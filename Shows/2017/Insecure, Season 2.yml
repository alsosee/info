name: Insecure, Season 2
description: >
  Insecure focuses on the awkward experiences and racy tribulations of a modern
  day African-American woman through the eyes of Issa Dee, played by Issa Rae.
  Jay Ellis will play Lawrence, Issa's depressed and unemployed boyfriend, who
  has been getting his act together for four years. Yvonne Orji is Molly,
  Issa's best friend. While very successful in her corporate work life, she is
  very unsuccessful in her love life.
