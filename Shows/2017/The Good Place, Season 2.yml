name: The Good Place, Season 2
description: >
  The Good Place is a smart, unique comedy about what makes a good person. The
  show follows Eleanor Shellstrop, an ordinary woman who enters the afterlife
  and, thanks to some kind of error, is sent to the Good Place instead of the
  Bad Place, which is definitely where she belongs. While hiding in plain sight
  from Michael, the wise architect of the Good Place (who doesn't know he's
  made a mistake), she's determined to shed her old way of living and discover
  the awesome (or, at least, the pretty good) person within.
