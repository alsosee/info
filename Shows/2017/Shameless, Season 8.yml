description: >
  "Shameless" Season 8 will kick off on Sunday, Nov. 5 at 9 p.m. ET/PT. Season eight finds the Gallaghers on an upswing – Frank (William H. Macy) comes out of a drug-induced haze and decides it's finally time to be a contributing member of society, while Fiona (Emmy Rossum) faces hard decisions when she discovers her success as a landlord may mean someone else's misfortune. Lip (Jeremy Allen White) struggles with unexpected sacrifices he must make to stay sober, while Ian (Cameron Monaghan) takes up a cause in hopes of getting back with Trevor. Debbie (Emma Kenney) builds her future at welding school while juggling life as a single working mom, as Carl (Ethan Cutkosky) gets creative finding tuition money after he loses his scholarship. Meanwhile, Liam (Christian Isaiah) discovers just how different the Gallaghers are from the families of his rich classmates as Frank schools him on "sticking it to the man."This season also features new recurring guest stars Jessica Szohr as Fiona's tenant, Nessa, and Farah Tahir as Frank's new boss, Adeeb. It also welcomes back returning recurring guest stars Elliot Fletcher as Trevor, Ruby Modine as Sierra and Scott Michael Campbell as Brad. Created by Paul Abbott, the series is produced by Bonanza Productions in association with John Wells Productions and Warner Bros. Television. It is executive produced by John Wells, Nancy M. Pimental, Christopher Chulack, Krista Vernoff, Etan Frankel and Sheila Callaghan.
