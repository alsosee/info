name: Orphan Black, Season 5
description: >
  The fifth and final season brings Sarah and the sestras to their darkest days in an
  effort to finally cut off the head of the snake and win their freedom. Throughout the
  season, the sisters individually delve into their past to confront personal struggles
  and emerge stronger through these self-explorations. Despite the great risk to attain
  freedom for themselves, their families, and the host of clone sisters they've yet to
  meet, clone club uncovers the missing pieces of the insidious conspiracy to finally
  learn the story behind their origin.
