  - name: "No Country for Old Dogs"
    description: >
      Johnny Five gets stuck in the basement (three-part sketch throughout episode), two whiny kids and Batman complain in the backseat of a car; Morgan Freeman narrates the night he nearly died in a car crash in 2008; a kid goes hysterically blind in this PSA for The Kids Who Have Seen Their Parents Jerking Off Fund; Superman tricks Lois Lane, Lana Lang, and Batman into thinking he sacrificed his powers for them; the "very special episode" of Diff'rent Strokes where Arnold and Dudley get groomed and nearly molested by a pedophilic bike shop owner becomes a parody of the Liam Neeson movie Taken; Rainbow Brite's sister, Rainbow Dim, is a conspiracy theorist; a bar hook-up turns into a mash-up of the "stolen kidney" and "You Have AIDS' mirror message" urban legends; the "hook-handed hitchhiker" urban legend is actually a wholesome story of how a man met his wife; the Veggie Tales spoof Fruity Fables takes on the need for sex education in public schools; and the mentally disabled take down Adolf Hitler and his Nazi regime in this send-up of Inglorious Basterds.
