  - name: Robot Chicken's DP Christmas Special
    description: >
      It's Christmas, and the Robot Chicken writers and animators are out to put your precious Yuletide memories through the wood chipper. In this installment: Santa Claus gets revenge on the Coca-Cola company for using his likeness without his permission; a look at caveman Christmas; COBRA's henchmen from GI Joe sing "Deck the Halls"; Macaulay Culkin reprises his role as Kevin MacCallister in a sketch that shows how Kevin setting up the traps for Marv and Harry are more dangerous than Marv and Harry falling victim to them.
    released: 2010-12-12
    length: 11m
    writers: Matthew Beans, Mike Fasolo, Seth Green, Brendan Hay,
  - name: Saving Private Gigli
    description: >
      Robot Chicken's recurring characters storm the beaches of Normandy; Predator stalks high school boys in the gym shower; a woman's bathtub suicide is interrupted by her husband using the toilet; Carl's balloon ride from the movie Up goes pear-shaped thanks to real-world physics; The Blockheads from Gumby get sentenced to death by Play-Doh Fun Factory; the real reason why Charlie Brown's parents' voices are represented by muted trumpet; Voldemort gets a nose job -- and a reason to go after Harry Potter; audience members' reactions to Stomp! have more rhythm than the actual show; couples skydiving turns into a marriage proposal, followed by a fight between the fiance and the ex-boyfriend; the Doozers from Fraggle Rock hire an illegal immigrant; and Skeletor rents out his castle to a fraternity to keep the bank from foreclosing on him.
    released: 2011-01-09
    length: 11m
    writers: Matthew Beans, Mike Fasolo, Seth Green, Breckin Meyer,
  - name: Terms of Endaredevil
    description: >
      Discover the secret origins of Mo-Larr, Eternian Dentist; a bald eagle wears a toupee; a sneak peek at Transformers 3; a LEGO man goes to court over teaching subversive material to children; a hot dog gets sexually humiliated by mustard; another sneak peek at Transformers 3; a rabbi refuses to "eat" a pig; Lara Croft from the Tomb Raider games is as cold as Tracy Ullman is annoying; Tobey Maguire and Jake Gyllenhaal star in the new movie, Earnest as F@*k; yet another sneak peek at Transformers 3; He-Man's father moves in with him; Kermit gets a prostate exam; Gargamel infiltrates the Smurfs' village with an avatar; and He-Man's father calls his son in a post-credits stinger.
