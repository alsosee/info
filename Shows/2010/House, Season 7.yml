name: House, Season 7
series: House
description: >
  Season 7 of House continues the series with a new run of episodes. In the
  Season 6 finale, House, driven by the loss of a patient he treated at an
  accident site and confronted with the unexpected news that Cuddy was now
  engaged, spiraled into despair and considered treating his mental and
  emotional anguish with Vicodin, potentially prompting the cycle of his
  dependency and addiction all over again.
