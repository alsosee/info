name: 24, Season 8
series: '24'
description: >
  Season 8 of 24 continues the series with a new run of episodes. Set 18 months
  after season 7, the story arc involves Jack Bauer contending with
  assassination threats made during a peace conference between President of the
  United States Allison Taylor and President Omar Hassan of the fictional
  Islamic Republic of Kamistan (IRK).
