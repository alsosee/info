name: Smallville, Season 10
description: >
  Super heroes emerge from the shadows, only to be driven underground by a public that
  labels them vigilantes. At the same time, otherworld forces of darkness gather,
  presenting Clark Kent with the greatest challenge of his young life. The world he
  calls home and the people he loves - including Lois Lane, who now shares his secret
  and his life - need a champion. Don't miss all the hopes, heartaches and heroics of a
  final season to remember. They will lift you up, up and away.
