name: Buffy the Vampire Slayer, Season 5
description: >
  Dawn appears in Sunnydale as a younger sister of Buffy. No one finds this strange, but
  it is soon revealed that the teenager is a mystical energy called The Key that was
  transformed by a group of monks, using Buffy's essence, into human form. False
  memories were implanted in all those concerned to protect the fourteen-year-old from
  Glory, an exiled God from a demon dimension who wants to leave the human body in which
  she is trapped (Ben the hospital intern) for her home universe.
