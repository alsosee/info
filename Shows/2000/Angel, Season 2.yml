name: Angel, Season 2
description: >
  Angel continues to seek redemption, but a fatal mistake makes him realize that racking
  up the body count isn't the way to go. So with a renewed sense of purpose, and
  Cordelia, Wesley and Gunn at his side, Angel sets out to make the streets of Los
  Angeles a little safer for everyone-unaware that Wolfram & Hart has summoned someone
  from his past to make sure he fails.
