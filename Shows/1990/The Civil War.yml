name: The Civil War
description: >
  Between 1861 and 1865, Americans made war on each other and killed each other
  in great numbers - if only to become the kind of country that could no longer
  conceive of how that was possible. What began as a bitter dispute over Union
  and States' Rights, ended as a struggle over the meaning of freedom in
  America.
