name: thirtysomething, Season 4
description: >
  thirtysomething is an American television drama about American baby boomers
  (in Philadelphia, Pennsylvania) who are now in their thirties. The series
  examines how this group of friends learns to negotiate their prior
  involvement with the early 1970s counterculture as young adults, in contrast
  to the yuppie lifestyle which dominated American culture during the 1980s.
