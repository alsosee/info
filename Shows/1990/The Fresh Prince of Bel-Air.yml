name: The Fresh Prince of Bel-Air
series: The Fresh Prince of Bel-Air
description: >
  Will Smith plays a young man transplanted from the tough streets of Philadelphia to
  live with his wealthy Bel-Air relatives, causing everyone to adjust how they live and
  think.
released: 1990-09-10
rating: TV-PG
genres:
  - comedy
  - family
network: NBC
wikipedia: https://en.wikipedia.org/wiki/The_Fresh_Prince_of_Bel-Air
imdb: https://www.imdb.com/title/tt0098800/episodes?season=1
tmdb: https://www.themoviedb.org/tv/1892/season/1
creators:
  - Andy Borowitz
  - Susan Borowitz
characters:
  - name: Will Smith
    actor: Will Smith
  - name: Philip Banks
    actor: James Avery
  - name: Carlton Banks
    actor: Alfonso Ribeiro
  - name: Hillary Banks
    actor: Karyn Parsons
  - name: Ashley Banks
    actor: Tatyana Ali
  - name: Geoffrey Butler
    actor: Joseph Marcell
  - name: Vivian Banks
    actor: Janet Hubert
  - name: Vivian Banks
    actor: Daphne Maxwell Reid
episodes:
  - name: The Fresh Prince Project
    description: >
      Aunt Vivian tries to mediate between her husband Philip and the newly arrived Will.
    released: 1990-09-10
    length: 30m
  - name: Bang the Drum, Ashley
    description: >
      Will persuades Ashley to pawn her violin for a drum set.
    released: 1990-09-17
    length: 30m
  - name: Clubba Hubba
    description: >
      Will wants to go out with a beautiful girl he meets at the country club, but first he
      must figure out how to impress her extremely snobbish and very protective father.
    released: 1990-09-24
    length: 30m
  - name: Not with My Pig, You Don't
    description: >
      Will tries to smooth things between Philip and his very rural parents when they visit
      to see him receive an award.
    released: 1990-10-01
    length: 30m
  - name: Homeboy, Sweet Homeboy
    description: >
      Will gets a visit from an old pal named Ice Tray, who, to Vivian and Philip's dismay,
      warms up to Hilary.
    released: 1990-10-08
    length: 30m
  - name: Mistaken Identity
    description: >
      While Philip and Vivian travel to Palm Springs, Will and Carlton are pulled over
      while driving a borrowed Mercedes-Benz.
    released: 1990-10-15
    length: 30m
  - name: Def Poet's Society
    description: >
      The family pressures Will to join an after school club.
    released: 1990-10-22
    length: 30m
  - name: Someday Your Prince Will Be in Effect (1)
    description: >
      The family heads to the mall to pick up costumes for Hilary's Halloween party, while
      Will and Carlton place a bet to see who can find a date for the party.
    released: 1990-10-29
    length: 30m
  - name: Someday Your Prince Will Be in Effect (2)
    description: >
      Will and Carlton both try to win Melinda over by making up stories about themselves.
    released: 1990-10-29
    length: 30m
  - name: Kiss My Butler
    description: >
      It is Geoffrey's birthday and Will decides to set him up on a blind date with an
      English woman named Helen as a gift.
    released: 1990-11-05
    length: 30m
  - name: Courting Disaster
    description: >
      Will joins the school basketball team, of which Carlton is already a member.
    released: 1990-11-12
    length: 30m
  - name: Talking Turkey
    description: >
      Will's mom, Vy, comes to the Banks household for Thanksgiving.
    released: 1990-11-19
    length: 30m
  - name: Knowledge is Power
    description: >
      In order to get the family car instead of Will, Hilary tells Phil that Will has been
      disobeying curfew, subcontracting his chores to Ashley and renting out the family car.
    released: 1990-11-26
    length: 30m
  - name: Day Damn One
    description: >
      Ashley and her friends ask Will to tell a scary story at their slumber party before
      they go to sleep.
    released: 1990-12-03
    length: 30m
  - name: Deck the Halls
    description: >
      Will realizes that Ashley has never experienced a real Christmas before (since back in
      Philadelphia, there would be carolers, lights and neat decorations, while in Bel-Air
      there are only a few decorations, no carolers, and hardly anything in the Christmas
      spirit) and goes out of his way to let her have one.
    released: 1990-12-10
    length: 30m
  - name: The Lucky Charm
    description: >
      Due to a couple of coincidences, one of Philip's clients, a very superstitious
      businessman, thinks Will is his good luck charm.
    released: 1991-01-07
    length: 30m
  - name: The Ethnic Tip
    description: >
      Will proposes a black history class be instituted at Bel-Air Academy, and expects an
      easy A when Vivian volunteers to teach it.
    released: 1991-01-14
    length: 30m
  - name: The Young and the Restless
    description: >
      When Uncle Phil's mother comes for a visit after recovering from a bout with the flu,
      Will talks her into rebelling against Phil's wishes of taking it easy in order to go
      to a rap concert.
    released: 1991-01-21
    length: 30m
  - name: It Had to Be You
    description: >
      Jazz asks Will the favor of taking his sister Janet out on a date after she moves into
      town.
    released: 1991-02-04
    length: 30m
  - name: Nice Lady
    description: >
      Geoffrey's old employer Lord Fowler and his daughter Lady Penelope come to the Banks'
      house for the weekend.
    released: 1991-02-11
    length: 30m
  - name: Love at First Fight
    description: >
      One of Vivian's students, Kayla Samuels comes over for dinner and Will tries to
      impress her but fails.
    released: 1991-02-18
    length: 30m
  - name: Banks Shot
    description: >
      Vivian goes away to Berkeley for the weekend, leaving Hilary in charge.
    released: 1991-02-25
    length: 30m
  - name: 72 Hours
    description: >
      Will makes a bet that Carlton wouldn't last a weekend in Jazz's neighborhood, Compton,
      because of the way he is.
    released: 1991-03-11
    length: 30m
  - name: Just Infatuation
    description: >
      Ashley's birthday is nearing and when the family asks her what she would like for her
      birthday, she shows them a picture of Little T, the popular teen singer.
    released: 1991-04-29
    length: 30m
  - name: Working It Out
    description: >
      Hilary lands a new job as an assistant to an actress, Marissa Redman who turns out to
      be completely disrespectful.
    released: 1991-05-06
    length: 30m
