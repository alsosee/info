name: Northern Exposure, Season 3
description: >
  Fresh out of New York's Columbia University, cocky young Dr. Joel Fleischman
  is looking forward to his comfortable position in Alaska's largest city. Upon
  his arrival, Joel finds himself a fish-out-of-water as he's instead assigned
  to a tiny Alaskan village where the offbeat locals would love him to stay
  forever.
