name: Quantum Leap, Season 4
description: >
  Get ready to join Dr. Sam Beckett on the adventure of many lifetimes! Who
  will he be this time? Mafia hit man. Air Force test pilot. Professional
  boxer. Sam Beckett is a time traveler who never knows whose body he is going
  to "leap" into next and at what moment in history he may find himself. Sam is
  joined by a helpful but easily distracted holographic guide Al, who assists
  him on his missions and aids Sam in his ultimate goal of returning to his own
  life in the present.
