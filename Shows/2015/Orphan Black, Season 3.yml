name: Orphan Black, Season 3
description: >
  Orphan Black returns for an electrifying third season that introduces a dangerous new
  threat to the 'clone club' sisterhood. Just as Sarah and her clone sisters were
  beginning to piece together the complex conspiracy behind the shadowy Dyad Institute,
  the discovery of Project Castor - a top-secret military project producing highly
  trained male clones - throws their lives back into turmoil.
