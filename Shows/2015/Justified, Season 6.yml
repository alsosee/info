name: Justified, Season 6
description: >
  Deputy U.S. Marshal Raylan Givens is something of a 19th century-style
  officer in modern times, whose unconventional enforcement of justice makes
  him a target with criminals and a problem for his superiors in the U.S.
  Marshals Service. As a result of an eager but "justified" shooting of a Miami
  fugitive while on assignment in Florida, Givens is reassigned to Lexington,
  Kentucky, in a district that includes his hometown of Harlan, a rural mining
  town in the east of the state.
