name: Mr. Robot
description: >
  Elliot Alderson is a young cyber-security engineer at Allsafe Cybersecurity in New
  York City; However, in his free time he's a vigilante hacker. He is recruited by
  fsociety, a group of black hat hackers led by Mr. Robot, to help take down a large
  corporate conglomerate, E Corp. E Corp is Allsafe's biggest client as well as
  responsible for the death of Elliot's father, putting him in a place of divided
  loyalties.
