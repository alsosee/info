description: >
  Major Lazer is an adult animated musical action series about a Jamaican superhero
  with a laser gun for a right hand. Set in a dystopian future Jamaica, the show
  follows Major Lazer, Penny Whitewall, and Blkmrkt as they fight President
  Whitewall and General Rubbish.
