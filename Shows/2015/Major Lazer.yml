episodes:
  - name: Bad Seed
    description: >
      While Major Lazer leaves on a spiritual vacation, Penny has a surreal
      encounter with the Weed Man and needs help staying grounded.
    released: 2015-04-16
    directors: Douglas Einar Olsen
    writers: Nick Rutherford
  - name: Escape from Rave Island
    description: >
      Penny convinces Major Lazer and Blkmrkt to bring a rave to a dangerous
      Ibiza, where party plans run into mutated locals and a law-enforcement robot.
    released: 2015-04-23
    directors: Aldin Baroza
    writers: Nick Rutherford
  - name: Treble in Paradise
    description: >
      Dr. Nerd steals the world's bass, sending Penny and Major Lazer after the
      missing drop before his experiment derails the music scene.
    released: 2015-04-30
    directors: Chase Conley
    writers: Nick Rutherford
  - name: Double Cup
    description: >
      President Whitewall and General Rubbish send Double Cup to sabotage Major
      Lazer's Free the Universe party with tainted soda.
    released: 2015-05-07
    directors: Chase Conley
    writers: Nick Rutherford
  - name: Vampire Weekend
    description: >
      A two-day solar eclipse brings teenage vampires to Future Kingston, where
      Penny falls for Ryland as President Whitewall tries to shut the party down.
    released: 2015-05-14
    directors: Douglas Einar Olsen
    writers: Nick Rutherford
  - name: The Legend of Spooky Dookie
    description: >
      As prom approaches, Penny investigates a dream-haunting spirit who is
      stealing the hearts of girls across Jamaica High.
    released: 2015-05-21
    directors: Chase Conley
    writers: Nick Weidenfeld
  - name: I'm Gonna Git You Suckoid
    description: >
      Underground creatures drawn to dance-floor vibrations push President
      Whitewall into banning dancing, while Penny meets a teen hunting them.
    released: 2015-05-28
    directors: Chase Conley and Paul Harmon
    writers: Sean O'Connor
  - name: "I, Killscreen"
    description: >
      Major Lazer is pulled into a dance video game while Penny and Blkmrkt face
      a tournament tied to the villainous Killscreen.
    released: 2015-06-04
    directors: Chase Conley
    writers: Sean O'Connor
  - name: Fizzy Fever
    description: >
      Blkmrkt finds Fizzy, a puppy with a musical bark, and Major Lazer has to
      protect it from President Whitewall's hired attackers.
    released: 2015-06-12
    directors: Chase Conley and Mike Davis
    writers: Nick Rutherford
  - name: K-Pop!!
    description: >
      General Rubbish commissions a synthetic pop star whose songs are designed
      to hypnotize teenagers and turn them against Major Lazer.
    released: 2015-06-18
    directors: Chase Conley
    writers: Sean O'Connor
  - name: Throwback Thursdays
    description: >
      A time-travel crisis brings zombies to Jamaica after Lady Vanessa Rothschild
      interferes with President Whitewall's past.
    released: 2015-06-25
    directors: Douglas Einar Olsen
    writers: Chris Goodwin
