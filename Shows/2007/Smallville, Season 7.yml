name: Smallville, Season 7
description: >
  There are two Clark Kents. One is the young on destiny's path. The other is a Bizarro
  who shares Clark's DNA but not his values. Only one of them can survive. Superman
  mythology grows deeper and more powerful in an event-packed season that includes the
  arrival of Clark's cousin Kara/Supergirl. Keep a low profile and master your powers,
  Clark says. Kara has other ideas.
