episodes:
  - name: The Hair Down There
    description: >
      Robert and Neesee struggle to deal with a letter that he wrote her four years earlier;
      Bobby discovers a hair.
    released: 2006-10-01
    length: 30m
  - name: Trojan Condo
    description: >
      Neesee finds a new condo to move into, but it is still under construction; Robert and
      Neesee help get Courtney (Laivan Greene) into Bobby's school.
    released: 2006-10-08
    length: 30m
  - name: Police...Open Up
    description: >
      Robert takes Bobby to the police station as a punishment for prank calling 911.
    released: 2006-10-16
    length: 30m
  - name: Love Do Cost a Thing
    description: >
      Neesee hosts a charity bachelor auction; Robert pays Neesee to bid on him, but a
      mystery woman outbids her.
    released: 2006-10-23
    length: 30m
  - name: Pretty Woman
    description: >
      Robert comes to a stranger's aid when her purse is stolen on the street, and they end
      up dating; Dirk recognizes her from a night club.
    released: 2006-10-30
    length: 30m
  - name: The Courtship of Robert's Father
    description: >
      Robert and his sister prepare for their father's 60th birthday celebration; Neesee
      helps Courtney prepare for the school dance.
    released: 2006-11-06
    length: 30m
  - name: Like Father, Like Son... Like Hell!
    description: >
      Robert and his sister learn the man who raised them is not Robert's biological father,
      prompting Dirk and Robert to begin a search.
    released: 2006-11-13
    length: 30m
  - name: My Two Dads
    description: >
      Robert remains stunned that his real father is gay; the family sits down for a
      Thanksgiving meal to remember.
    released: 2006-11-20
    length: 30m
  - name: Crime and Maybe Some Punishment
    description: >
      Robert grounds Bobby from attending his field trip for being disrespectful to Dirk,
      but Neesee secretly takes Bobby on the trip.
    released: 2006-11-27
    length: 30m
  - name: Everybody Loves Rain Man
    description: >
      Robert and Neesee threaten to take away Bobby's Christmas gifts; Dirk anticipates
      spending his first holiday with his daughter.
    released: 2006-12-11
    length: 30m
  - name: Let's Go Bobby, Let's Go!
    description: >
      Bobby reveals to Robert that he joined the cheerleading squad instead of playing
      peewee football.
    released: 2007-01-22
    length: 30m
  - name: The B-R-E-A-K-U-P
    description: >
      Neesee agrees to go out with Robert's co-worker (Kevin Hart); Dirk helps Bobby
      practice for a spelling bee.
    released: 2007-01-29
    length: 30m
  - name: An All of Us Joint... Custody Episode
    description: >
      Robert and Neesee share custody of their new condo when Bobby tells them that he does
      not want to go back and forth between houses.
    released: 2007-02-05
    length: 30m
  - name: Artificial Intelligence
    description: >
      Bobby finds himself in the gifted students program after cheating on his aptitude
      test; Neesee's new neighbor sets sets her up on a date with a guy who has a weird
      fetish.
    released: 2007-02-12
    length: 30m
  - name: Another Episode of All of Us
    description: >
      Bobby tries to steal a pair of sneakers to fit in with the cool kids; Neesee
      reluctantly agrees to help care for her neighbor's newborn niece.
    released: 2007-02-19
    length: 30m
  - name: He's Got Game
    description: >
      At Robert's college reunion, his former professor (Victoria Rowell) attracts him;
      Neesee reconnects with a national sports reporter.
    released: 2007-02-26
    length: 30m
  - name: It Was Fun While It Lasted
    description: >
      Neesee visits a fertility clinic to research potential sperm donors; Robert and Dirk
      spend an evening hitting on women.
    released: 2007-03-19
    length: 30m
  - name: The Boy Is Mine
    description: >
      Dirk refuses to speak to Robert, who begins spending time with the man that Neesee has
      been dating.
    released: 2007-03-26
    length: 30m
  - name: Everything Happens for a Reason
    description: >
      Dirk sues Robert when he believes he was wrongfully terminated; Neesee reveals to Ben
      that she orchestrated their meeting.
    released: 2007-04-23
    length: 30m
  - name: Sins of the Father
    description: >
      Robert starts to spend time with a single mother and her son; Dirk asks Neesee to help
      him comfort Courtney.
    released: 2007-04-30
    length: 30m
  - name: She Blinded Me with Science
    description: >
      Robert learns Neesee's plans to visit a sperm bank to have a baby; Michelle (Toni
      Trucks) goes to the sperm bank with Neesee to lend support.
    released: 2007-05-07
    length: 30m
  - name: The Wedding Singers
    description: >
      Neesee invites Robert to her mother's wedding while questions about another child put
      their relationship in focus.
    released: 2007-05-14
    length: 30m
