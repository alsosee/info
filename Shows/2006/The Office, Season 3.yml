name: "The Office, Season 3"
series: The Office
previous: Shows/2005/The Office, Season 2
description: >
  The season marked the move of main character Jim Halpert from Scranton to Stamford, and also
  introduced Rashida Jones as Karen Filippelli, and Ed Helms as Andy Bernard, both members of
  Dunder Mifflin Stamford, as recurring characters. The main plot for the early episodes of the
  season deals with a recurring problem in seasons one and two, the problem of company
  downsizing, while in the last half of the season, inter-office relationships also became a
  major plot point.
