name: Smallville, Season 6
description: >
  They tried to be friends. But their chosen paths set them on a collision course. The
  Clark Kent-Lex Luthor rivalry explodes into the fierce good-versus-evil battle fans
  have long expected. Adding to the rivalry: Lana Lang becomes Mrs. Luthor. Clark would
  be stunned to find out why she says yes. Green Arrow forms a Super Hero league. Will
  Clark join? Luthorcorp expands its dark experiments. Will an awesome Kryptonite-
  powered army be the result? The answers - and thrills - are here!
