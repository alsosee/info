name: Death Note
description: >
  Brilliant student Light Yagami finds a supernatural notebook that can kill anyone whose name is written inside it.
  As Light remakes himself into the anonymous judge Kira, the secretive detective L begins a psychological pursuit that turns justice into a deadly contest of identity and control.
