name: Angel
description: >
  Angel, the dashing vampire from Buffy the Vampire Slayer, embarks on his own
  supernatural adventures in Los Angeles. City of Angels. City of Broken Dreams. Between
  pervasive evil and countless temptations lurking beneath the city's glittery facade,
  L.A. is the ideal address for a fallen vampire looking to save a few lost souls and,
  in turn, perhaps redeem his own.
