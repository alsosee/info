name: Smallville, Season 8
description: >
  There's a new reporter at the Daily Planet: Clark Kent, who shares a workspace with
  Lois Lane. There's a new hero in Metropolis, too. No one knows who he is. But Jimmy
  Olsen was on the scene of one of the do-gooder's exploits, and he snapped a blurred
  photo of the hero in superspeed action - a hero everyone now calls the Red-Blue Blur.
