name: "O.J.: Made in America"
description: >
  It is the defining cultural tale of modern America - a saga of race,
  celebrity, media, violence, and the criminal justice system. And two decades
  after its unforgettable climax, it continues to fascinate, polarize, and
  even, yes, develop new chapters. O.J. revisits - and redefines - it all. The
  domestic abuse. The police investigation. The white Bronco chase. The trial
  of the century. The motive, the blood, the glove. The verdict. The aftermath.
  Drawing upon more than seventy interviews - from longtime friends and
  colleagues of Simpson to the recognizable protagonists of the murder
  investigation to observers and commentators with distinct connections to the
  story - the documentary is an engrossing, compelling, and unforgettable look
  at a tantalizing saga. Because at the end of what seems like a search for the
  real truth about O.J. Simpson, what's revealed just as powerfully is a
  collection of indelible, unshakeable, and haunting truths about America, and
  about ourselves.
