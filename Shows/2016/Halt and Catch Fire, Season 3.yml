name: Halt and Catch Fire, Season 3
description: >
  In the third season, which picks up in March 1986, Mutiny leaves Texas for the big
  leagues of Silicon Valley. Founders Cameron Howe and Donna Clark search for the idea
  that will launch Mutiny as a player, but new collaborators test their partnership.
  Gordon struggles to find a place within his wife's company as Joe McMillan builds upon
  his empire, reinventing himself with a bold play that shocks the Valley and sends him
  back into the lives of his old partners.
