name: Mr. Robot, Season 2
description: >
  MR. ROBOT follows Elliot Alderson (Rami Malek), a young cyber-security engineer who
  becomes involved in the underground hacker group fsociety, after being recruited by
  their mysterious leader (Christian Slater). Following the events of fsociety's 5/9
  hack on multi-national company Evil Corp, the second season will explore the
  consequences of that attack as well as the illusion of control. MR. ROBOT stars Golden
  Globe Award and SAG® Award Nominee Malek ("The Pacific"), Golden Globe Award Winner
  Slater ("Nymphomaniac"), Portia Doubleday ("Her"), Carly Chaikin ("Suburgatory"),
  Martin Wallström ("Simple Simon"), Grace Gummer ("Extant"), Michael Cristofer ("Ray
  Donovan") and Stephanie Corneliussen ("Legends of Tomorrow"). New recurring guest
  stars include Craig Robinson ("The Office"), hip hop artist Joey Bada$$, Sandrine Holt
  ("Fear The Walking Dead"), Michael Maize ("National Treasure: Book of Secrets"),
  Dorothi Fox ("Run All Night") and Luke Robertson ("The Americans"). Returning cast
  members include BD Wong ("Law & Order: SVU"), Gloria Reuben ("Saints & Sinners"),
  Michael Drayer ("Vinyl"), Michel Gill ("House of Cards"), Ron Cephas Jones ("The
  Blacklist"), Sunita Mani ("5 Stages"), Azhar Khan ("Veep") and Ben Rappaport ("The
  Good Wife").
