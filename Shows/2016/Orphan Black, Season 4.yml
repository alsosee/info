name: Orphan Black, Season 4
description: >
  The new season sees Sarah returning home from her Icelandic hideout to track down an
  elusive new ally tied to deceased clone Beth, whose identity Sarah stole in the
  series' first episode. With the stakes higher than ever before, Sarah and her sisters
  band together to uncover the missing chapter of the clone conspiracy – following
  Beth's footsteps into a dangerous relationship with a potent enemy who holds the key
  to their survival.
