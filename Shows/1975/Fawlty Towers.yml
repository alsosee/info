name: Fawlty Towers
description: >
  Fawlty Towers is set in a fictional hotel in the seaside town of Torquay. The
  plots centre on tense, rude and put-upon owner Basil Fawlty, his bossy wife
  Sybil, comparatively normal chambermaid Polly, who is often the peacemaker
  and voice of reason, and hapless Spanish waiter Manuel, showing their
  attempts to run the hotel amidst farcical situations and an array of
  demanding and eccentric guests.
released: 1975-09-19
