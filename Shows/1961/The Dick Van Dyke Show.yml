name: The Dick Van Dyke Show
description: >
  The Dick Van Dyke Show centers on the personal and professional lives of Rob
  Petrie, a writer for the fictional "Alan Brady Show". The non-stop laughs
  revolved around Rob's relationships with with fellow writers Buddy Sorrell
  and Sally Rogers, and producer Mel Cooley. At home, we also got to chuckle
  (and sometimes cry) over Rob's antics involving his wife, son, and neighbors.
released: 1961-10-03
