name: Bewitched, Season 6
description: >
  Bewitched is an American fantasy sitcom television series about a witch
  (Samantha) who marries an ordinary mortal man (Darrin) and vows to lead the
  life of a typical suburban housewife. Although they agree that Sam is not to
  use witchcraft now that they are married, a problem always seems to crop up
  and Sam always resorts to spells. Things become even more complicated when
  Endora, Samantha's witch mother, starts to interfere.
