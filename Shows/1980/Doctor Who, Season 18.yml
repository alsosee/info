name: Doctor Who, Season 18
description: >
  Doctor Who is the longest-running science fiction TV series in history,
  airing initially from 1963 to 1989. Doctor Who is about ideas. It pioneered
  sophisticated mixed-level storytelling. Its format was the key to its
  longevity: the Doctor, a mysterious traveller in space and time, travels in
  his ship, the TARDIS. The TARDIS can take him and his companions anywhere in
  time and space. Inevitably he finds evil at work wherever he goes..
