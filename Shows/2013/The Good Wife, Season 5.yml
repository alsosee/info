name: The Good Wife, Season 5
description: >
  The Good Wife follows Alicia Florrick, a wife and mother who boldly assumes
  full responsibility for her family and re-enters the workforce after her
  husband's very public sex and political corruption scandal lands him in jail.
  Pushing aside the betrayal and crushing public humiliation caused by her
  husband Peter, Alicia starts over by pursuing her original career as a
  defense attorney.
