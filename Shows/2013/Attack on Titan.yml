name: Attack on Titan
description: >
  After a catastrophic breach exposes humanity's walled cities to man-eating Titans, Eren Yeager joins the military with Mikasa Ackerman and Armin Arlert.
  Their first season turns survival training and city defense into a grim introduction to the Scouts, the Titans, and the secrets behind the walls.
