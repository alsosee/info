name: The Crown, Season 5
description: >
  Diana and Charles wage a media war. The monarchy's role is up for debate.
  Welcome to the '90s - and Queen Elizabeth II's biggest challenge to date.
  With the new decade in its stride, the Royal Family are presented with
  possibly their biggest challenge to date as the public openly question their
  role in '90s Britain. As Queen Elizabeth II approaches the 40th anniversary
  of her accession, she reflects on a reign that has encompassed nine prime
  ministers, the advent of mass television and the twilight of the British
  Empire. Yet new challenges are on the horizon. The collapse of the Soviet
  Union and the transfer of sovereignty in Hong Kong signals a seismic shift in
  the international order presenting both obstacles and opportunities.
  Meanwhile, trouble is brewing closer to home. Prince Charles pressures his
  mother to allow him to divorce Diana, presenting a constitutional crisis of
  the monarchy. Rumors circulate as husband and wife are seen to live
  increasingly separate lives and, as media scrutiny intensifies, Diana decides
  to take control of her own narrative, breaking with family protocol to
  publish a book that undermines public support for Charles and exposes the
  cracks in the House of Windsor. Tensions are set to rise further, as Mohamed
  Al Fayed arrives on the scene. Driven by his desire for acceptance of the
  highest order, he harnesses his self-made wealth and power to try and earn
  him and his son Dodi a seat at the royal table.
