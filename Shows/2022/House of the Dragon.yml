name: House of the Dragon
description: >
  Set 200 years before the events of Game of Thrones, House of the Dragon tells
  the history of House Targaryen as they fight through a civil war.
released: 2022-08-21
rating: TV-MA
genres:
  - drama
  - action
  - fantasy
network: HBO
wikipedia: https://en.wikipedia.org/wiki/House_of_the_Dragon
imdb: https://www.imdb.com/title/tt11198330
website: https://www.hbo.com/content/house-of-the-dragon
creators:
  - Ryan Condal
  - George R. R. Martin
characters:
  - name: Prince Daemon Targaryen
    actor: Matt Smith
  - name: Ser Criston Cole
    actor: Fabien Frankel
  - name: Princess Rhaenyra Targaryen
    actor: Emma D'Arcy
  - name: Lord Corlys Velaryon
    actor: Steve Toussaint
  - name: Mysaria
    actor: Sonoya Mizuno
  - name: Grand Maester Orwyle
    actor: Kurt Egyiawan
  - name: Lady Alicent Hightower
    actor: Olivia Cooke
  - name: Lord Larys Strong
    actor: Matthew Needham
episodes:
  - name: The Heirs of the Dragon
    description: >
      Viserys hosts a tournament to celebrate the birth of his second child.
      Rhaenyra welcomes her uncle Daemon back to the Red Keep.
    released: 2022-08-21
    length: 70m
  - name: The Rogue Prince
    description: >
      Six months later. Rhaenyra oversteps at the Small Council. Viserys is urged
      to secure the succession through marriage. Daemon announces his intentions.
    released: 2022-08-28
    length: 60m
  - name: Second of His Name
    description: >
      Two years later. Daemon and the Sea Snake battle the Crabfeeder. The realm
      celebrates Aegon's second nameday. Rhaenyra faces the prospect of marriage.
    released: 2022-09-04
    length: 66m
  - name: King of the Narrow Sea
    description: >
      Rhaenyra continues her search for a suitable match, Daemon returns to Kings
      Landing and stirs more trouble for the King. Rhaenyra learns a valuable
      lesson about desires and what it means to be a daughter of a King.
    released: 2022-09-11
    length: 65m
  - name: We Light the Way
    description: >
      Daemon visits his wife in the Vale. Viserys and Rhaenyra broker agreements
      with the Velaryons. Alicent seeks the truth about the princess.
    released: 2022-09-18
    length: 63m
  - name: The Princess and the Queen
    description: >
      Ten years after the wedding between Rhaenyra Targaryen and Laenor Velaryon,
      King Viserys survived his collapse and has now fathered 3 children with
      Alicent Hightower. Rhaenyra navigates Alicent's continued speculation about
      her parentage of children, while Daemon and Laena weigh an offer in Pentos.
    released: 2022-09-25
    length: 70m
  - name: Driftmark
    description: >
      As the families gather on Driftmark for a funeral, Viserys calls for an end
      to infighting and Alicent demands justice.
    released: 2022-10-02
    length: 62m
  - name: The Lord of the Tides
    description: >
      Six years later. With the Driftmark succession suddenly critical, Rhaenyra
      attempts to strike a bargain with Rhaenys.
    released: 2022-10-09
    length: 71m
  - name: The Green Council
    description: >
      While Alicent enlists Cole and Aemond to track down Aegon, she plots a heavy
      political drama in Kings Landing to crown her first-born son. Amidst all the
      obstacles, the hand, the queen and their allies successfully names Aegon II
      to be the next king. Otto gathers the great houses of Westeros to affirm
      their allegiance.
    released: 2022-10-16
    length: 61m
  - name: The Black Queen
    description: >
      While mourning a tragic loss, Rhaenyra tries to hold the realm together, and
      Daemon prepares for war.
    released: 2022-10-23
    length: 62m
