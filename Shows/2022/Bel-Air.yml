name: Bel-Air
series: Bel-Air
description: >
  Set in modern-day Los Angeles, Bel-Air imagines the beloved sitcom The Fresh Prince of
  Bel-Air through a new, dramatic take on Will's complicated journey from the streets of
  West Philadelphia to the gated mansions of Bel-Air. As these two worlds collide, Will
  reckons with the power of second chances while navigating the conflicts, emotions, and
  biases of a world far different from the only one he's ever known.
