name: Grey's Anatomy, Season 19
series: Grey's Anatomy
description: >
  Season 19 of Grey's Anatomy continues the series with a new run of episodes.
  Now in its 19th season, a lot has changed around Grey Sloan Memorial.
  Following Bailey's resignation, Meredith assumes the role of Interim Chief of
  Surgery; under her tenure, she has revived the residency program, recruiting
  surgical residents who either were not good enough to get into other programs
  or kicked out of their previous ones.
