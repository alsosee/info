episodes:
  - name: Just Dunk Me
    description: >
      Eve tracks Helene with help from one of her assassins on her quest for
      revenge against The Twelve; Villanelle strives to become good, so she joins a
      church community; after being pushed into an embassy role, Carolyn tries to
      get back in the game.
    released: 2022-02-20
    length: 42m
  - name: Don't Get Eaten
    description: >
      Eve locates Helene; Villanelle's quest for change goes awry; Carolyn is
      pushed aside by MI6.
    released: 2022-02-27
    length: 41m
  - name: A Rainbow in Beige Boots
    description: >
      Having stalked Helene, a new lead allows Eve to uncover a name in The
      Twelve's top tier; Villanelle is rejected by Eve when she seeks help;
      operating abroad, Carolyn discovers more promising intel on a spate of
      torturous murders linked to The Twelve.
    released: 2022-03-06
    length: 42m
  - name: It's Agony and I'm Ravenous
    description: >
      Eve struggles to identify her lead in The Twelve; Villanelle gets her mojo
      back -- she decides to be good by embracing what she's good at: killing;
      Carolyn discovers an old acquaintance in Cuba and decides to go rogue.
    released: 2022-03-13
    length: 42m
  - name: Don't Get Attached
    description: >
      Eve delves into the past of her target and unearths some secrets; Villanelle
      embraces killing again, but she tries doing it altruistically before deciding
      to kill those who oppressed her; Carolyn tracks down a top member of The
      Twelve.
    released: 2022-03-20
    length: 42m
  - name: Oh Goodie, I'm the Winner
    description: >
      Eve and Villanelle reunite before parting to pursue their own missions, which
      leads Villanelle to another assassin in the Twelve. Eve moves closer to
      achieving her revenge mission, and Carolyn is forced to face a ghost from her
      past.
    released: 2022-03-27
    length: 42m
  - name: Making Dead Things Look Nice
    description: >
      Eve takes on an even bigger revenge mission against the Twelve, and realises
      she may need Villanelle's help. Villanelle has a dalliance with the new
      assassin, while Carolyn's latest string of intel may lead her home.
    released: 2022-04-03
    length: 41m
  - name: Hello, Losers
    description: >
      Eve and Villanelle focus on making a seismic stab at The Twelve, even if it
      means risking their own lives. With fresh intel, they pursue the mission
      before it's too late. Carolyn arrives home as a traitor and has a finite
      amount of time to use her intel as leverage to get herself back in the game.
    released: 2022-04-10
    length: 42m
