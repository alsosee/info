name: The Handmaid's Tale, Season 5
description: >
  June faces consequences for killing Commander Waterford while struggling to
  redefine her identity and purpose. The widowed Serena attempts to raise her
  profile in Toronto as Gilead's influence creeps into Canada. Commander
  Lawrence works with Aunt Lydia as he tries to reform Gilead and rise in
  power. June, Luke and Moira fight Gilead from a distance as they continue
  their mission to save and reunite with Hannah.
