episodes:
  - name: Development Day
    description: >
      The teachers are back for development week, a time to prepare for the
      upcoming year; Janine is determined to start the year off right and leave her
      problems at home; Ava runs a side hustle out of the school parking lot.
    released: 2022-09-21
    length: 31m
  - name: Wrong Delivery
    description: >
      Janine is determined to make Abbott Elementary look just as good as a new
      charter school; Gregory goes out of his way to avoid Barbara; Ava hosts an
      event to help decide what to do with the rest of the funds from the grant.
    released: 2022-09-28
    length: 31m
  - name: Story Samurai
    description: >
      A traveling storytelling troupe Jacob used to be in visits Abbott Elementary
      for a day of education and entertainment; Melissa struggles with the new
      normal of her combined second and third grade class.
    released: 2022-10-05
    length: 31m
  - name: The Principal's Office
    description: >
      After Gregory sends a disruptive student to the principal's office, he
      discovers the kids actually enjoy spending supposed disciplinary time with
      Ava; Melissa invites Janine over to her house to teach her how to cook.
    released: 2022-10-12
    length: 31m
  - name: Juice
    description: >
      Janine is thrilled to help introduce a new beverage to the cafeteria, but it
      ends up causing unexpected consequences; Melissa clashes with her new aide,
      Ashley, who brings more disruption than help to the classroom.
    released: 2022-10-19
    length: 31m
  - name: Candy Zombies
    description: >
      A student steals a bag of Halloween candy meant to be given out to the kids
      at the end of the day and starts distributing it during school hours; Janine
      is invited to a Halloween party by an old friend and starts to reconsider her
      personal life.
    released: 2022-10-26
    length: 31m
  - name: Attack Ad
    description: >
      The teachers are appalled after seeing a commercial in support of charter
      schools criticizing Abbott Elementary; Janine and Gregory talk about Janine's
      relationship with Tariq.
    released: 2022-11-02
    length: 31m
  - name: Egg Drop
    description: >
      When the eighth grade science class participates in an egg drop activity,
      Janine insists her second grade class join in; Barbara is shocked at the
      clothing one of her student's parents wears.
    released: 2022-11-16
    length: 31m
  - name: Sick Day
    description: >
      Janine is out sick for the day, so Ava grows desperate and must step in to
      help out; Barbara and Melissa revel in the quieter-than-normal teacher's
      lounge.
    released: 2022-11-30
    length: 31m
  - name: Holiday Hookah
    description: >
      Janine is convinced by a friend to go to a popular hookah club where she runs
      into unexpected colleagues; Jacob crashes Barbara and Melissa's traditional
      holiday dinner and in the process begins to learn the true meaning of
      Christmas.
    released: 2022-12-07
    length: 31m
  - name: Read-A-Thon
    description: >
      The competition heats up between Melissa and Janine as their classes go
      head-to-head in a read-a-thon sponsored by a local pizza shop; Jacob and
      Gregory join forces and attempt to get their student-podcasting club off the
      ground.
    released: 2023-01-04
    length: 31m
  - name: Fight
    description: >
      Two of Janine's students aren't getting along, leading her to seek advice
      from her colleagues on how to help repair their friendship; Melissa and Ava
      plot to bring down Mr. Johnson in fantasy football.
    released: 2023-01-11
    length: 31m
  - name: Fundraiser
    description: >
      Barbara organizes a candy-selling fundraiser to raise money for a school
      field trip to the science museum; when sales don't go as planned, Ava steps
      in to teach the students new, unconventional selling tactics.
    released: 2023-01-18
    length: 31m
  - name: Valentine's Day
    description: >
      The Abbott teachers discuss their relationships and plans for Valentine's
      Day; Janine finds out one of her students has a crush on her; Ava sits in on
      Jacob's Black History class after receiving a complaint.
    released: 2023-02-08
    length: 31m
  - name: Fire
    description: >
      Barbara's candle accidentally starts a small fire in the teacher's lounge,
      and a counselor suggests that she might not be handling the aftermath well;
      Melissa rekindles her childhood dream of being a firefighter.
    released: 2023-02-15
    length: 31m
  - name: Teacher's Conference
    description: >
      Staff members head to the Pennsylvania Educational Conference; Gregory
      reluctantly attends after a disagreement with Amber; Jacob finds himself
      charmed by the Addington teachers.
    released: 2023-02-22
    length: 32m
  - name: Mural Arts
    description: >
      Jacob secures a visit from a mural arts program for his students; Barbara and
      Melissa learn parents are petitioning to turn Abbott into a charter school.
    released: 2023-03-01
    length: 32m
  - name: Teacher Appreciation
    description: >
      On Teacher Appreciation Day, the district gives Abbott two courtside tickets
      to a 76ers game and the teachers must decide who deserves them; Janine
      invites the teachers to her house for game night and her sister, Ayesha,
      comes to visit.
    released: 2023-03-08
    length: 32m
  - name: Festival
    description: >
      Abbott Elementary rallies together to fight the threat from Legendary Charter
      Schools; Ava pitches a festival to draw parents to school and collect their
      signatures for a petition, but Draemond shows up with the intention of
      derailing the event.
    released: 2023-03-15
    length: 32m
  - name: Educator of the Year
    description: >
      Gregory is named Educator of the Year; Janine deals with a difficult student;
      it is revealed that Barbara hasn't completed her teaching requirements.
    released: 2023-04-05
    length: 32m
  - name: Mom
    description: >
      Janine's plan for a Memorial Day weekend solo trip is derailed when her
      mother shows up unannounced asking for help; Gregory notices his colleagues
      are great at small talk and realizes he needs to brush up on his people
      skills.
    released: 2023-04-12
    length: 32m
  - name: Franklin Institute
    description: >
      Abbott Elementary takes a field trip to the Franklin Institute; Gregory is
      eager to spend time with a reluctant Janine; Ava teaches the students about
      aliens, which leads to chaos.
    released: 2023-04-19
    length: 32m
