  - name: Junk in the Trunk
    description: >
      Rachael Leigh Cook smashes more than eggs in her latest This Is Your Brain on Drugs public service announcement. Optimus Prime, leader of the Autobots, falls prey to prostate cancer.
    released: 2005-02-20
    length: 11m
    directors: Matthew Senreich
    writers: Seth Green, Pat McCallum and Matthew Senreich
  - name: Nutcracker Sweet
    description: >
      Voltron engages in an old-school dance-off in "You Got Robo-Served." The secret lives of nature's most fascinating beasts are exposed in "Secrets of the Animal Kingdom." Testicles are terrorized in "Ode to the Nut Shot." Walt Disney's severed head with its giant robotic spider-body attacks Cuba. See how much the kids are horrified in "Scary Barney"
    released: 2005-02-27
    length: 11m
    directors: Doug Goldstein
    writers: Seth Green, Matthew Senreich and Mike Fasolo
  - name: Gold Dust Gasoline
    description: >
      The animals Noah left behind try to survive the flood in their very own ark. Enjoy instant nostalgia with "That '00s Show."
    released: 2005-03-06
    length: 11m
    directors: Tom Root
    writers: Seth Green, Matthew Senreich and Mike Fasolo
  - name: Plastic Buffet
    description: >
      America sends Harrison Ford and Aerosmith into space to take out a killer asteroid in Meteorgeddon. Household animals take to the slopes for "Winter Pet Games." Chucky from the Child's Play series takes on the cutesy Lettuce Head Kids in the opening to season 8 of Buffy the Vampire Slayer.
    released: 2005-03-13
    length: 11m
    directors: Tom Root
    writers: Seth Green, Matthew Senreich and Mike Fasolo
  - name: Toyz in the Hood
    description: >
      The tooth fairy stumbles into domestic violence and murder in "Tooth and Consequences." The world's most diabolical supervillains get stuck in traffic. More of television's greatest screw-ups, from CSI to Mister Rogers' Neighborhood and Pro-sports, are highlighted in "Bloopers."
    released: 2005-03-20
    length: 11m
    directors: Matthew Senreich
    writers: Seth Green, Mike Fasolo, Pat McCallum and Matthew Senreich
  - name: Vegetable Fun Fest
    description: >
      The secrets of The Crying Game, Sleepaway Camp, Star Wars and The Village are exposed in "Welcome to the Spoilers." The Teen Titans strengthen their roster by adding Beavis and Butt-head. Benny Hill's funeral is a farce.
    released: 2005-03-27
    length: 11m
    directors: Doug Goldstein
    writers: Seth Green, Mike Fasolo and Matthew Senreich
  - name: A Piece of the Action
    description: >
      A teenage girl gets a fashion makeover in "Pimp My Sister." The Surreal Life gang gets sent on a mission to destroy an enchanted ring. Debbie Does Dallas gets re-told with the world's cheapest puppets in "Exhausted Budget Theater." Geeks and nerds collide when a science fiction convention erupts into war.
    released: 2005-04-03
    length: 11m
    directors: Seth Green
    writers: Seth Green, Matthew Senreich and Mike Fasolo
  - name: The Deep End
    description: >
      Seven of the world's greatest heroes stop being polite and start getting real in "The Real World: Metropolis." Icons from Star Trek and Tiger Beat alike unite for canned sitcom laughs in "Two Kirks, a Khan and a Pizza Place." Jesus Christ hunts down his greatest nemesis, Tarantino-style in "Kill Bunny." The hottest game show from Japan is here: "Who Poop Last?!" The legends of rock 'n' roll return from beyond the grave to haunt the "Zombie Idol" reality show.
    released: 2005-04-10
    length: 11m
    directors: Seth Green
    writers: Seth Green, Pat McCallum and Matthew Senreich
  - name: S&M Present
    description: >
      The last surviving member of 'N Sync, Joey Fatone, must avenge his murdered bandmates in a deadly martial arts tournament in "Enter the Fat One". Check out a little scrambled porn on your 1980s-era cable box.
    released: 2005-04-17
    length: 11m
    directors: Tom Root
    writers: Seth Green, Mike Fasolo, Pat McCallum and Matthew Senreich
  - name: Badunkadunk!
    description: >
      The roller-coaster celebrity life of the Hulk is profiled in "Hollywood Spotlight." The Masters of the Universe are rocked by a Paris Hilton-style sex tape. Michael Jackson returns from space to confront his n'er-do-well alter ego in "Where's Michael?"
    released: 2005-04-24
    length: 11m
    directors: Seth Green
    writers: Seth Green, Mike Fasolo and Matthew Senreich
  - name: Toy Meets Girl
    description: >
      William Shatner's toupee has adventures the action star can only dream of. Heaven is not all it is cracked up to be in "Can We Handle the Truth?" Hilary Duff's new film combines history and teen drama in an updated "The Diary of Anne Frank." The fates of the greatest action figure toy lines from decades past are exposed in "Where Are They Now?" with host Michael Moore.
    released: 2005-05-01
    length: 11m
    directors: Matthew Senreich
    writers: Seth Green, Mike Fasolo, Pat McCallum and Matthew Senreich
  - name: Midnight Snack
    description: >
      "The World's Most One-Sided Fistfights" get wild at Mardi Gras. Benjamin Franklin grapples with historical figures like the Wright brothers and Mahatma Gandhi in "Educational Wrestling Federation." Oprah Winfrey fulfills all her viewers' fondest wishes...almost.
    released: 2005-05-15
    length: 11m
    directors: Seth Green
    writers: Seth Green, Mike Fasolo and Matthew Senreich
  - name: Atta Toy
    description: >
      A teenage girl gets crazy about everyone around her. The world's most famous monkey bursts loose on Skull Island in "Ding Dong, King Kong." Scandalous Hollywood news and gossip get the Pat O'Brien treatment.
    released: 2005-05-22
    length: 11m
    directors: Tom Root
    writers: Seth Green, Mike Fasolo and Matthew Senreich
  - name: Joint Point
    description: >
      Sailor Moon encounters a bone-chilling villain. A nerd wins a date with Scarlett Johansson.
    released: 2005-06-05
    length: 11m
    directors: Doug Goldstein
    writers: Seth Green, Mike Fasolo and Matthew Senreich
  - name: Kiddie Pool
    description: >
      Michael Knight's talking car parties hard in "KITT's Day Out." A brawl rocks the nursing home in "Grandma Fu." Mary-Kate and Ashley Olsen unite to fight a rampaging dragon. George Jetson's murder takes center stage in "Unsolved Case Files: I, Rosie."
    released: 2005-06-12
    length: 11m
    directors: Doug Goldstein
    writers: Seth Green, Matthew Senreich and Mike Fasolo
  - name: Nightmare Generator
    description: >
      Jaws gets a special edition DVD. A drug operation at the North Pole is revealed in "Unsolved Case Files: Claus & Effect." The A-Team solves its problems with maximum firepower and minimal intelligence.
    released: 2005-06-19
    length: 11m
    directors: Matthew Senreich
    writers: Seth Green, Mike Fasolo, Pat McCallum and Matthew Senreich
  - name: "Operation: Rich in Spirit"
    description: >
      A new video game is taking video games by storm, "Codename: The Abortionator." A video dating experience a la The Ring scares a potential suitor. A man runs away from an Oriental masseuse looking for a "happy ending".
    released: 2005-06-26
    length: 11m
    directors: Seth Green
    writers: Seth Green, Mike Fasolo and Matthew Senreich
  - name: The Sack
