    writers: Seth Green, Mike Fasolo, Pat McCallum and Matthew Senreich
  - name: Adultizzle Swizzle
    description: >
      It's Alien vs. Predator on the battleground of love in a special episode of "First Date." Frogger creates a huge car wreck in this episode.
    released: 2008-04-11
