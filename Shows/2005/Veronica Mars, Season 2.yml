name: Veronica Mars, Season 2
description: >
  Kristen Bell stars as Veronica Mars, a smart, fearless 18-year-old apprentice
  private investigator dedicated to solving the mysteries of the wealthy,
  seaside California community of Neptune. This season, Veronica becomes
  embroiled in another mystery that hits even closer to home. She also deals
  with her increasingly complicated romantic life and a new school year.
