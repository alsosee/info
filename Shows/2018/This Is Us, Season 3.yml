name: This Is Us, Season 3
description: >
  Sometimes life will surprise you. This refreshingly honest and provocative
  series follows a unique ensemble whose paths cross and their life stories
  intertwine in curious ways. We find several of them share the same birthday,
  and so much more than anyone would expect. From the writer and directors of
  "Crazy, Stupid, Love" comes a smart, modern dramedy that will challenge your
  everyday presumptions about the people you think you know.
