name: Roseanne, Season 10
description: >
  Featuring the complete original cast, new series regulars and notable
  returning guest stars, the revival will explore life, death and everything in
  between through the relatable, hilarious and brutally honest lens of the
  Conner household. With the inimitable Roseanne at its epicenter, fresh
  stories that tackle today's issues and even more laughs from a brilliant cast
  and crew that haven't missed a beat, audiences old and new will celebrate the
  homecoming of America's favorite working-class family.
