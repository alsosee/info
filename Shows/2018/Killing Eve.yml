episodes:
  - name: Nice Face
    description: >
      MI5 security officer Eve Polastri is bored in her job and yearns for a more
      exciting life. When a Russian politician is murdered, Eve is tasked with
      protecting the only witness and soon finds herself on a collision course with
      violent and extraordinary assassin, Villanelle.
    released: 2018-04-08
    length: 60m
  - name: I'll Deal with Him Later
    description: >
      In the aftermath of her recent assignment, Villanelle is ordered to take a
      break. Never one to do as she's told, she goes ahead with her next mission
      regardless. Meanwhile, Eve is given a dream opportunity to join a secret MI6
      unit tracking Villanelle and the shady organisation she works for.
    released: 2018-04-15
    length: 60m
  - name: Don't I Know You?
    description: >
      When Villanelle kills a Chinese Colonel at a kink clinic in Berlin, Eve and
      Bill travel out to investigate. While Eve and Bill chase up a number of
      promising leads, Villanelle enjoys the cat and mouse of their proximity. But
      as they draw closer, Eve comes to realise that this is much more than a game.
    released: 2018-04-22
    length: 60m
  - name: Sorry Baby
    description: >
      Intel from Berlin points to the existence of a mole, prompting Eve to
      undertake her first surveillance operation. Meanwhile, Villanelle is sent to
      England to eliminate a member of British Intelligence. Villanelle wonders,
      could it be Eve? Meanwhile Eve, in emotional turmoil, now knows how high the
      stakes are.
    released: 2018-04-29
    length: 60m
  - name: I Have a Thing About Bathrooms
    description: >
      Having survived a terrifying close call with Villanelle, Eve now has the mole
      ensconced in a safe house and is buzzing. They have an exciting opportunity
      to glean information and crack this thing open.
    released: 2018-05-06
    length: 60m
  - name: Take Me to the Hole!
    description: >
      A female assassin is taken into custody in Russia, and Eve and Carolyn head
      out to Moscow to negotiate access. She could hold the key to the organization
      that runs Villanelle. Meanwhile, Villanelle is smuggled into the same Russian
      jail.
    released: 2018-05-13
    length: 60m
  - name: I Don't Want to Be Free
    description: >
      Tensions are running high as the situation in Moscow escalates, and Eve
      starts to question who she can trust. Despite the danger, with her sights
      firmly set on Villanelle, Eve goes rogue. With both women under pressure, the
      stakes are higher than ever.
    released: 2018-05-20
    length: 60m
  - name: God, I'm Tired
    description: >
      Villanelle's mission is proving anything but straightforward, forcing her to
      take drastic measures. Meanwhile, Eve makes a shocking discovery, which leads
      her right to Villanelle and an electrifying confrontation from which neither
      will emerge unscathed.
    released: 2018-05-27
    length: 60m
