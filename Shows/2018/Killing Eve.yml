name: Killing Eve
description: >
  Two women, a psychopathic assassin and a brilliant MI5 agent. Both tasked
  with the same deadly mission: Find Her.
released: 2018-04-08
rating: TV-14
genres:
  - drama
  - crime
  - thriller
network: BBC America
wikipedia: https://en.wikipedia.org/wiki/Killing_Eve
imdb: https://www.imdb.com/title/tt7016936
website: https://www.amcplus.com/pages/killingeve
creators:
  - Phoebe Waller-Bridge
characters:
  - name: Villanelle
    actor: Jodie Comer
  - name: Eve Polastri
    actor: Sandra Oh
  - name: Carolyn Martens
    actor: Fiona Shaw
  - name: Konstantin Vasiliev
    actor: Kim Bodnia
  - name: Niko Polastri
    actor: Owen McDonnell
  - name: Kenny Stowton
    actor: Sean Delaney
  - name: Hugo Turner
    actor: Edward Bluemel
  - name: Hélène
