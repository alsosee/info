name: Happy Days, Season 11
description: >
  Set in Milwaukee, Wisconsin in the 1950's, Happy Days revolves around Richie
  Cunningham and his family and friends. A "wholesome" young man, Richie is a
  Jefferson High School student who would do anything to get a date and he
  spends plenty of time with his friends at Arnold's, the local burger joint.
  Contrasting with his wholesome nature is Arthur Fonzarelli, best known as
  Fonzie, a rough-around-the-edges motorcycle riding high school dropout famous
  for his slicked hair, leather jacket, and the catchphrase "aaayyyy!" Fonzie
  is a regular around the Cunningham house, with Mrs. Cunningham doting on him
  and Richie turning to him for advice on how to attract girls.
