name: Angel, Season 3
description: >
  Even as Angel mourns the death of Buffy, Darla makes her way to L.A. with a mysterious
  new life growing within her. Now thrust into a role he never imagined, Angel needs the
  assistance of the Angel Investigations team more than ever. But while Cordelia, Gunn
  and Fred rally round the new dad, an ancient and deadly prophecy convinces Wesley to
  commit the ultimate betrayal.
