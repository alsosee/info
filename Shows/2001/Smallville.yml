name: Smallville
description: >
  Clark Kent takes on a whole new dimension in this precursor to the Superman legend.
  The town of Smallville, Kansas, never seemed the same after the meteor shower 12 years
  ago. That was the day Clark Kent arrived on Earth--and the day strange things started
  happening in Smallville. Now, Clark is a teenager, and his growing pains are amplified
  by the burden of his emerging superpowers.
