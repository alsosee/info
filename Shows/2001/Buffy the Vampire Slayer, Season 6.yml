name: Buffy the Vampire Slayer, Season 6
description: >
  Willow resurrects Buffy with a powerful spell. Although her friends believe that they
  have taken her out of Hell, Buffy had actually been in Heaven since her death (a fact
  that is later revealed to her friends). She is therefore traumatized by her
  resurrection and this causes her to fall into a deep depression. Meanwhile Giles
  returns to England after realizing that Buffy has become too reliant on him, while
  Buffy takes up a fast-food job for money and develops a secret, mutually abusive
  relationship with Spike.
