episodes:
  - name: Pilot
    description: >
      An entertainment reporter raises his 5-year-old his son with his ex-wife while
      embarking on a new relationship.
    released: 2003-09-16
    length: 30m
  - name: Birthdaze
    description: >
      Neese and Tia try to out-do each other by planning separate birthday parties for Bobby
      Jr.; Bobby Jr.'s friends (Trey and Jaden Smith) convince him that his parents are
      getting back together.
    released: 2003-09-23
    length: 30m
  - name: Here Comes the Bride
    description: >
      Tia gets jealous when she finds Robert's old wedding video showing him happy with his
      former wife; Neesee and Robert fight over who gets custody of Bobby Jr.'s old crib.
    released: 2003-09-30
    length: 30m
  - name: Kindergarten Confidential
    description: >
      Neesee volunteers at Bobby Jr.'s school, where she comes between Tia and her best
      friend; Beyonce Knowles towns the tables on Robert during an interview.
    released: 2003-10-07
    length: 30m
  - name: Say My Name, Say My Name
    description: >
      Neesee reveals that she intends to keep Robert's last name, even though they are
      officially divorced.
    released: 2003-10-14
    length: 30m
  - name: Uncle Marcus Comes to Dinner
    description: >
      Neesee starts dating her handsome dentist (Boris Kodjoe); Robert's jealousy escalates
      to a childish competition.
    released: 2003-10-21
    length: 30m
  - name: Spatial Profiling
    description: >
      Robert insists that both Tia and Neesee be included in a profile of his home life only
      to learn that Neesee has been edited out.
    released: 2003-11-04
    length: 30m
  - name: Tia Moves In
    description: >
      Bobby Jr.
    released: 2003-11-11
    length: 30m
  - name: Jonny Comes Marching Home
    description: >
      A recently divorced college buddy (Will Smith) returns to Los Angeles and ends up
      romantically entangled with Neesee.
    released: 2003-11-18
    length: 30m
  - name: Out of the Picture
    description: >
      Robert and Tia's passion is checked by a fear of exposure; Neesee wants to use
      Robert's contacts to start a catering business.
    released: 2003-11-25
    length: 30m
  - name: I Saw Tia Kissing Santa Claus
    description: >
      Bobby Jr.
    released: 2003-12-16
    length: 30m
  - name: Catering
    description: >
      The catering business is booming when Bobby starts acting out, forcing Neesee to
      balance her career and his needs.
    released: 2004-01-13
    length: 30m
  - name: Used ta Be My Girl
    description: >
      After Larry allows Tia's old friend to stay with them, he becomes suspicious of his
      motives toward Tia; Neesee and Alex take over Robert's kitchen.
    released: 2004-01-27
    length: 30m
  - name: Boxing
    description: >
      Neesee is furious when she finds out that Robert has taught their son to box; Alex
      tries a few moves on her trainer (Sugar Shane Mosley).
    released: 2004-02-10
    length: 30m
  - name: "Jonny Come Lately: Part 1"
    description: >
      Robert's college buddy, Johnny (Will Smith), returns to see Neesee, and they all take
      a road trip to Las Vegas.
    released: 2004-02-17
    length: 30m
  - name: "Jonny Come Lately: Part 2"
    description: >
      Neesee proposes to Robert's college buddy, Johnny (Will Smith), but the newly engaged
      couple is too afraid to tell him.
    released: 2004-02-17
    length: 30m
  - name: O Brother, Where Art Thou?
    description: >
      Dirk's estranged brother (Tyra Banks) reveals he has had a sex-change operation;
      Robert's mother (Patti LaBelle) collapses during a visit.
    released: 2004-02-24
    length: 30m
  - name: A Family Affair
    description: >
      Neesee's child-support check bounces when Tia accidentally gives Robert's sister,
      Carmen (Tisha Campbell-Martin), money that was intended for Bobby Jr.; Dirk and
      Jonelle try to start a romance.
    released: 2004-03-02
    length: 30m
  - name: Wedding Dance
    description: >
      Robert tries to prove his love for Tia by having a wedding that is more extravagant
      than his first wedding to Neesee.
    released: 2004-03-30
    length: 30m
  - name: Thirty Candles
    description: >
      Robert forgets Tina's birthday until the last minute, when he frantically enlists
      Neesee and Bobby's help to throw together a surprise party.
    released: 2004-05-04
    length: 30m
  - name: Playdate
    description: >
      When Robert and Neesee learn that Bobby does not socialize in school, they book a
      play-date for him with the most popular kid in the class.
    released: 2004-05-11
    length: 30m
  - name: It Takes Three to Tango
    description: >
      Tia re-examines her relationship with Robert when she realizes that marrying him means
      that Neesee will also be a part of her life forever; an instructor (Michael DeLorenzo)
      gives the gang tango lessons.
    released: 2004-05-18
    length: 30m
