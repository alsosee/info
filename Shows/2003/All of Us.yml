name: All of Us
series: All of Us
description: >
  All of Us, the series inspired by the domestic adventures of entertainment superstars
  Will Smith and Jada Pinkett Smith, reflects a new generation's enlightened attitude
  toward juggling ex-spouses, dating and professional lives with humor, sensitivity and
  heart. Robert James, an entertainment reporter for a local Los Angeles television
  station, is handsome, smart and thoroughly modern in his thinking -- as he should be,
  considering his romantic and parental entanglements. Recently divorced from the
  somewhat self-absorbed Neesee, the mother of their endearing 6-year-old son, Bobby
  Jr., they refuse to buy into the old stereotype that being divorced means you can't
  get along with the ex. Providing friendship and varying degrees of support and advice
  to Robert is Dirk, his best friend and producer. A free-spirited bachelor, Dirk always
  pushes Robert to live his life to the fullest.
released: 2003-09-16
rating: TV-PG
genres:
  - comedy
network: The CW
