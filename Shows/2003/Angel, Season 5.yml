name: Angel, Season 5
description: >
  The Angel Investigations team is stunned when the Senior Partners of Wolfram & Hart
  give them control of the L.A. office. The gang quickly moves in, and although everyone
  is delighted at the amazing resources they now have at their command, they can't stop
  wondering what the catch is. But the biggest mystery of all revolves around a small
  package Angel receives containing an amulet and a handful of dust — which coalesces
  into a very-much-alive Spike.
