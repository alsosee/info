name: Smallville, Season 3
description: >
  Everyone has a future. Clark Kent has a destiny - if he's willing to accept and able
  to master all the awesome powers and responsibilities that come with it. Season 3
  shows Clark's embracing of his dark side... and the devil's bargain Jonathan makes
  with Jor-El to rescue his son.
