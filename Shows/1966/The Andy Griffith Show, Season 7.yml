name: The Andy Griffith Show, Season 7
description: >
  Down-home humor and an endearing cast of characters helped to make The Andy
  Griffith Show one of the most beloved comedies in the history of television.
  Introduced as a spinoff from The Danny Thomas Show in 1960, The Andy Griffith
  Show ran for eight seasons in prime time. Widower Andy Taylor divides his
  time between raising his young son, Opie, and his job as sheriff (and Justice
  of the Peace) of the sleepy North Carolina town, Mayberry. Andy and Opie live
  with Andy's Aunt Bee, who serves as a surrogate mother to both father and
  son. Andy's nervous cousin, Barney Fife, is his deputy sheriff whose utter
  incompetence is tolerated because Mayberry is virtually crime-free.
