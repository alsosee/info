name: The Larry Sanders Show, Season 5
description: >
  Comic Garry Shandling draws upon his own talk show experiences to create the
  character of Larry Sanders, a paranoid, insecure host of a late night talk
  show. Larry, along with his obsequious TV sidekick Hank Kingsley and his
  fiercely protective producer Artie, allows Garry Shandling and his talented
  writers to look behind the scenes and to show us a convincing slice of behind
  the camera life.
