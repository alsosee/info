name: Buffy the Vampire Slayer
description: >
  Buffy Summers has just moved to Sunnydale after burning down her old school's gym and
  hopes to escape her Slayer duties. Her plans are complicated by Rupert Giles, her new
  Watcher, who reminds her of the inescapable presence of evil. Sunnydale High is built
  atop a Hellmouth, a portal to demon dimensions that attracts supernatural phenomena to
  the area. Buffy meets two schoolmates, Xander Harris and Willow Rosenberg, who help
  her fight evil through the series. She also gets a love interest in the form of Angel,
  a vampire who has a soul. They soon become known as the "Scoobies". Together they must
  prevent The Master, an ancient and especially threatening vampire, from opening the
  Hellmouth and taking over Sunnydale.
