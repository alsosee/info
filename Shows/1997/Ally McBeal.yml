name: Ally McBeal
description: >
  Tells the story of Ally McBeal, a young lawyer who found herself without a
  job after being sexually harassed by her boss, only to end up employed by her
  friend from college, Richard Fish, to work in the firm he created with his
  friend John Cage, named "Cage & Fish."
