name: Buffy the Vampire Slayer, Season 2
description: >
  Buffy Summers returns from a summer in Los Angeles after her death at the end of the
  first season. After distancing herself from her friends and loved ones with her new,
  self-centered attitude that almost gets them killed, Buffy comes to terms with the
  traumatic events that transpired and crushes the bones of The Master once and for all,
  much to the annoyance of The Anointed One. A few weeks later two new vampires come to
  town, Spike and a weakened Drusilla who intend to use the blood of Drusilla's sire,
  Buffy's new boyfriend and ensouled vampire Angel, to restore her to full health when
  the time is right. Impatient with the ritualistic attitude of the Order of Aurelius,
  Spike kills the Anointed One and becomes the more informal leader of Sunnydale's
  vampire society.
