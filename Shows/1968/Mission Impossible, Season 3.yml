name: "Mission: Impossible, Season 3"
description: >
  The IMF is a top-secret branch of the U.S. government that takes on missions
  deemed "impossible" by all other agencies. Each of the team members can be
  disavowed if necessary. Leading the team is first Daniel Briggs, and then Jim
  Phelps. Each week they recruit a team of specialists to accomplish the
  mission, whether it's break into an impenetrable safe, or bring a fugitive to
  justice, or simply deal with mobsters who are beyond the reach of
  conventional law enforcement.
