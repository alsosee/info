description: >
  Fred and Wilma Flintstone live a Stone Age version of suburban life in Bedrock,
  where modern conveniences are powered by prehistoric creatures and everyday
  domestic problems become animated sitcom chaos. The first season introduces
  Fred, Wilma, Barney, Betty, and Dino through bowling nights, schemes, neighbors,
  and family comedy.
