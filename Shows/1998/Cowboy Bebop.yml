name: Cowboy Bebop
description: >
  Spike Spiegel and Jet Black drift through the solar system as bounty hunters aboard the Bebop, picking up allies, debts, and old enemies along the way.
  The series mixes space western, noir, martial arts, and jazz-inflected science fiction into a self-contained run of episodic cases and character reckonings.
