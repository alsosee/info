name: Buffy the Vampire Slayer, Season 3
description: >
  After attempting to start a new life in Los Angeles, Buffy Summers returns to
  Sunnydale, and is reunited with her friends and her mother. She is no longer a
  criminal suspect; but Principal Snyder, who took a vindictive pleasure in expelling
  Buffy, refuses to reinstate her until he is told down by Giles. Angel is resurrected
  mysteriously by the unseen Powers That Be. While Buffy is happy to have Angel back, he
  seems to have lost much of his sanity in Hell. Buffy helps Angel recover but, having
  seen Angel's demonic side, Buffy's friends distrust him until he saves them from a
  monster.
