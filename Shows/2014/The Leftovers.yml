name: The Leftovers
description: >
  Three years after "The Sudden Departure," where two percent of the world's population
  disappeared suddenly, the townspeople of Mapleton struggle with life including Police
  Chief Kevin Garvey, who has to deal with mysterious happenings in town, his two
  rebelling teenaged children, as well as a cult called the Guilty Remnant that includes
  Laurie, a self-proclaimed prophet named "Holy Wayne", Rev. Matt Jamison, and Mayor
  Lucy Warburton in this drama series based on Tom Perrotta's novel of the same name.
