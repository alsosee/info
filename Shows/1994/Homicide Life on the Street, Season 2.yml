name: "Homicide: Life on the Street, Season 2"
description: >
  One of the most critically acclaimed shows in TV history, Homicide: Life on
  the Street reinvigorated a tired genre by focusing on the grueling work of
  solving murders instead of an endless succession of bloody crimes and car
  chases. Inspired by David Simon's Edgar Award-winning account of Baltimore
  homicide detectives and brought to television by writer Paul Attanasio and
  director Barry Levinson, Homicide boasted a powerhouse ensemble cast
  featuring Ned Beatty, Yaphet Kotto, Richard Belzer, and breakout star Andre
  Braugher.
