name: The Queen's Gambit
description: >
  In a 1950s orphanage, a young girl reveals an astonishing talent for chess
  and begins an unlikely journey to stardom while grappling with addiction.
released: 2020-10-23
rating: TV-MA
genres:
  - drama
  - coming-of-age
network: Netflix
wikipedia: https://en.wikipedia.org/wiki/The_Queen%27s_Gambit_(miniseries)
imdb: https://www.imdb.com/title/tt10048342
website: https://www.netflix.com/title/80234304
creators:
  - Scott Frank
  - Allan Scott
characters:
  - name: Beth Harmon
    actor: Anya Taylor-Joy
  - name: Alice Harmon
    actor: Chloe Pirrie
  - name: Mr. Shaibel
    actor: Bill Camp
  - name: Mrs. Alma Wheatley
    actor: Marielle Heller
  - name: Vasily Borgov
