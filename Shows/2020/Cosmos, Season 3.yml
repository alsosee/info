name: Cosmos, Season 3
description: >
  Following the wildly successful "Cosmos: A Spacetime Odyssey," Neil deGrasse
  Tyson returns as host to translate more revelations of science into a lavish
  transporting experience, taking audiences on a series of spiritual voyages of
  exploration. The show reveals previously uncharted realms, including lost
  worlds, worlds yet to come, and the worlds that humans may one day inhabit.
  Ann Druyan, the original creative collaborator to Carl Sagan, whose iconic
  docuseries "Cosmos" inspired this series, serves as executive producer
  alongside Seth MacFarlane.
