episodes:
  - name: Slowly Slowly Catchy Monkey
    description: >
      Eve is attempting to rebuild her life, having been shot by Villanelle.
      Villanelle is also moving on, until she is approached by an old foe. Carolyn
      is being undermined at work and Kenny can't leave his own investigation into
      The Twelve alone.
    released: 2020-04-12
    length: 60m
  - name: Management Sucks
    description: >
      Eve and Carolyn are reeling. Eve strikes up an unlikely alliance with Kenny's
      colleagues at the Bitter Pill. Villanelle finds that management isn't all
      it's cracked up to be.
    released: 2020-04-19
    length: 60m
  - name: Meetings Have Biscuits
    description: >
      Villanelle agrees to a job which will take her back to London; Carolyn's
      Moscow contacts come in use when Eve and the Bitter Pill team unravel a
      potential lead to The Twelve; Konstantin finds himself under pressure from
      all sides.
    released: 2020-04-26
    length: 60m
  - name: Still Got It
    description: >
      Villanelle receives good news about her upcoming promotion but can't shake
      the feeling that there's still something missing from her life. Dasha seeks a
      solution to Villanelle's erratic behavior.
    released: 2020-05-03
    length: 60m
  - name: Are You from Pinner?
    description: >
      Villanelle returns home to Mother Russia to try to find her family. Perhaps a
      new connection to her roots will give her back what's been missing in her
      life.
    released: 2020-05-10
    length: 60m
  - name: End of Game
    description: >
      Carolyn finds out information is being withheld by those close to her. Eve
      finds a lead on Villanelle. Meanwhile, Villanelle has had enough and decides
      on a different path. Konstantin's loyalties are split.
    released: 2020-05-17
    length: 60m
  - name: Beautiful Monster
    description: >
      Eve finds a clue to Villanelle's whereabouts in the most unlikely of places,
      Villanelle and Dasha work together on a hug, and the pressure is getting to
      Konstantin.
    released: 2020-05-24
    length: 60m
  - name: Are You Leading or Am I?
    description: >
      Konstantin makes a break for it. Carolyn might have finally found what she's
      looking for. Eve and Villanelle try to work out what the future may hold for
      them.
    released: 2020-05-31
    length: 60m
