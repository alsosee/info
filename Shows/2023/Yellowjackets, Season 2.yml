episodes:
  - name: Friends, Romans, Countrymen
    description: >
      Two months into winter the survivors cope with falling rations, low morale
      and their latest disastrous attempt to freeze a teammate out of the game.
    released: 2023-03-24
    length: 59m
  - name: Edible Complex
    description: >
      The Yellowjackets barely made it through summer in the woods, but as winter
      arrives, their hunger and desperation turn into full-on psychosis;
      twenty-five years later, the survivors ask whether the darkness comes for
      them or if it comes from them.
    released: 2023-03-31
    length: 60m
  - name: Digestif
    description: >
      The girls experience an unusual hangover. Shauna learns the thrill of
      peer-to-peer car rentals. Natalie audits Lottie's class in emotional
      apiology. Tai reflects, Misty hits the high seas, and you've never attended a
      baby shower like the one the Yellowjackets throw here.
    released: 2023-04-07
    length: 58m
  - name: Old Wounds
    description: >
      Relive your youth by hitting the road! Take a roadtrip with your child! Go on
      vacation with a new friend! Hitchhike, if you must! Just make sure you pack a
      good playlist for the ride. Some recommendations from us: "Anything You Can
      Do," "You Get What You Give," "Instinct," a famous composition by Frank
      Comstock, but absolutely not anything from "Starlight Express".
    released: 2023-04-14
    length: 60m
  - name: Two Truths and a Lie
    description: >
      Okay, Fellowjackets, rise and shine and don't forget your booties because
      it's coooold out there. Misty makes a leap of faith for her bestie, Natalie
      and Lottie play a game of surrender, Shauna finds herself unexpectedly randy,
      and Tai seeks out a movie recommendation.
    released: 2023-04-21
    length: 59m
  - name: Qui
    description: >
      Trapped inside on a snow day, the Yellowjackets revisit the highlights,
      humiliations and traumas of "Health Class". Tai and Van help each other
      kindly rewind, Misty explores joining a classic Cosmic American tribute band,
      Lisa helps Natalie carp the day, and Shauna gets a pop-quiz on her
      cookie-reading assignment.
    released: 2023-05-05
    length: 56m
  - name: Burial
    description: >
      Sometimes the best therapy is cranking the hits to eleven, so today we're
      exploring the hardcore kid-care revival movement, 11 o'clock theatrical
      birdcore numbers, some late hits of the renovation wave era (call us about a
      spinoff!), flower duets, and a classic live record. Out in the wilderness,
      Coach Scott does a great Karl Havoc impression for an unimpressed Misty.
    released: 2023-05-12
    length: 59m
  - name: It Chooses
    description: >
      Shhh, it's only going to get worse from here. Despite the whole "winter
      never's gonna end" thing, the 1996 New Jersey state girls soccer champions
      decide to start their spring training early with an impromptu cardio session.
      Callie encounters an old flame, Van proves goalies never say die, most of the
      adults intentionally commune in the sharing shack, and, Lottie, baby, I hear
      the blues are calling for tossed salad and scrambled eggs. Mercy!
    released: 2023-05-19
    length: 51m
  - name: Storytelling
    description: >
      Heavy is the head that wears the antler crown is a lesson you don't learn
      until much later in life... if you ever even learn it at all. Everything's
      about to get really wild(erness), and we're so excited (so excited!) and so,
      so scared to find out who paid attention to what lessons and when. So, on the
      count of three, you may pick up your pencil, open your testing booklet, and
      start this finale exam. One... Two... Season finale.
    released: 2023-05-26
    length: 61m
