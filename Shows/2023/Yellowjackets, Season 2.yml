name: Yellowjackets, Season 2
description: >
  The Yellowjackets barely made it through summer, but now as winter begins to
  bite, we'll see if hunger and desperation turn into full-on psychosis.
  Meanwhile, 25 years later, each survivor must determine if the darkness is
  coming for them or from them.
