episodes:
  - name: Episode 1
    description: >
      Go Ah-in competes for an executive promotion inside VC Planning while
      Jung Jae-hoon approaches her with an offer.
    released: 2023-01-07
    length: 1h4m
  - name: Episode 2
    description: >
      Kang Han-na returns to Korea as Ah-in discovers the terms behind her new
      executive role and begins planning her response.
    released: 2023-01-08
    length: 1h6m
  - name: Episode 3
    description: >
      Ah-in makes an aggressive personnel move at the agency and stakes her
      future on an ambitious revenue challenge.
    released: 2023-01-14
    length: 1h4m
  - name: Episode 4
    description: >
      Ah-in scrambles to protect her position when a major client's legal
      crisis threatens her revenue target, while Han-na starts work at VC.
    released: 2023-01-15
    length: 1h4m
  - name: Episode 5
    description: >
      Jo Eun-jung reaches out to Ah-in over work-life pressure as Ah-in pushes
      Han-na toward a more strategic role at the agency.
    released: 2023-01-21
    length: 1h3m
  - name: Episode 6
    description: >
      Han-na faces a difficult press opportunity, Eun-jung sees Ah-in at a
      vulnerable moment, and Ah-in takes on a demanding public relations task.
    released: 2023-01-22
    length: 1h4m
  - name: Episode 7
    description: >
      Han-na turns the Uwon Group account into a high-stakes competition,
      forcing Ah-in and Choi Chang-su into a direct agency showdown.
    released: 2023-01-28
    length: 1h4m
  - name: Episode 8
    description: >
      Ah-in discovers the real purpose of the Uwon Group project and races with
      her team to shape a pitch that can survive the competition.
    released: 2023-01-29
    length: 1h1m
  - name: Episode 9
    description: >
      Ah-in takes a defiant approach during the Uwon Group presentation while
      Han-na tries to establish her authority inside VC Planning.
    released: 2023-02-04
    length: 1h3m
  - name: Episode 10
    description: >
      Ah-in deals with mounting personal pressure after a VC Group dinner, and
      Choi begins reassessing Han-na and Park Young-woo's relationship.
    released: 2023-02-05
    length: 1h5m
  - name: Episode 11
    description: >
      Han-soo, backed by Choi, questions Han-na and Park's relationship while
      Han-na prepares a strategic marriage plan to mislead him.
    released: 2023-02-11
    length: 1h3m
  - name: Episode 12
    description: >
      Ah-in begins to reconcile with her mother's modest life as Han-na
      retaliates during a matchmaking meeting.
    released: 2023-02-12
    length: 1h7m
  - name: Episode 13
    description: >
      Jung-seok makes a surprising decision about Choi's wedding proposal for
      his daughter while Park's resignation weakens Han-na's position.
    released: 2023-02-18
    length: 1h4m
  - name: Episode 14
    description: >
      After refusing a major advertising proposal, Ah-in resigns over the
      revenue target and brings Chairman Wang a single proposal for the future.
    released: 2023-02-19
    length: 1h3m
  - name: Episode 15
    description: >
      Jung-seok exposes VC Group corruption during Wuseong Milk's ad bidding as
      Ah-in investigates Han-soo's link to a controversial ad model.
    released: 2023-02-25
    length: 1h6m
  - name: Episode 16
    description: >
      Ah-in launches a counterattack against corruption while she and Han-na
      pursue their goals amid turbulent corporate politics.
    released: 2023-02-26
    length: 1h13m
