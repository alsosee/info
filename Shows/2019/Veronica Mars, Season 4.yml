name: Veronica Mars, Season 4
description: >
  Spring breakers are getting murdered in Neptune, thereby decimating the
  seaside town's lifeblood tourist industry. After Mars Investigations is hired
  by the parents of one of the victims to find their son's killer, Veronica is
  drawn into an epic eight-episode mystery that pits the enclave's wealthy
  elites, who would rather put an end to the month-long bacchanalia, against a
  working class that relies on the cash influx that comes with being the West
  Coast's answer to Daytona Beach.
