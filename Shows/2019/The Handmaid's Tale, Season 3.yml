name: The Handmaid's Tale, Season 3
description: >
  The third season of The Handmaid's Tale is driven by June's resistance to the
  dystopian regime of Gilead and her struggle to strike back against
  overwhelming odds. Startling reunions, betrayals, and a journey to the
  terrifying heart of Gilead force all characters to take a stand, guided by
  one defiant prayer: "Blessed be the fight."
