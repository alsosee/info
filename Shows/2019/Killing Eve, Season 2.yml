episodes:
  - name: Do You Know How to Dispose of a Body?
    description: >
      Eve is reeling from her act of violence against Villanelle and doesn't know
      whether she is alive or dead. A paranoid and severely injured Villanelle
      manages to get herself to the hospital for treatment. Carolyn approaches Eve
      with an intriguing opportunity.
    released: 2019-04-07
    length: 60m
  - name: Nice and Neat
    description: >
      Carolyn introduces Eve to her new team before Eve briefs them on the
      Villanelle case. Villanelle, needing to lie low while she recovers, finds a
      good Samaritan to take her in and care for her.
    released: 2019-04-14
    length: 60m
  - name: The Hungry Caterpillar
    description: >
      Villanelle's new circumstances are looking bleak; Eve makes a dangerous deal
      with an old acquaintance; Villanelle is surprised when she is approached by a
      figure from her past.
    released: 2019-04-21
    length: 60m
  - name: Desperate Times
    description: >
      Villanelle decides to take matters into her own hands on a trip to Amsterdam.
      Carolyn is called in to face the music with her boss. After the discovery of
      another dead body, Eve and her new team make a break in their case.
    released: 2019-04-28
    length: 60m
  - name: Smell Ya Later
    description: >
      The MI6 team make a pact with the devil in order to get information from The
      Ghost. A visitor from Broadmoor comes with a dire warning. And Eve and
      Villanelle find themselves closer than ever.
    released: 2019-05-05
    length: 60m
  - name: I Hope You Like Missionary!
    description: >
      The point of no return. Villanelle uses her unrivaled infiltration skills to
      immerse herself in the world of a new target. Their relationship on the
      rocks, Eve and Niko confront each other about their future.
    released: 2019-05-12
    length: 60m
  - name: Wide Awake
    description: >
      Villanelle dives deep into the dangerous world of her target under the guise
      of her newfound persona, Billie. Eve may have worrying competition for
      Villanelle's affections.
    released: 2019-05-19
    length: 60m
  - name: You're Mine
    description: >
      Eve's mission is disastrously compromised. Carolyn briefs Eve on her current
      status as an employee of the British government and leaves Eve's future in
      her own hands. Villanelle does everything she can in order to get to her
      ultimate target.
    released: 2019-05-26
    length: 60m
