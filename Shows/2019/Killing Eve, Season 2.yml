name: Killing Eve, Season 2
description: >
  Season 2 begins 30 seconds after the final episode of the first season; Eve
  is reeling and Villanelle has disappeared. Eve has no idea if the woman she
  stabbed is alive or dead, and now both of them are in deep trouble. Eve has
  to find Villanelle before someone else does, but unfortunately, she's not the
  only person looking for her.
