name: "Vampire: The Masquerade"
description: >
  Vampire: The Masquerade is a tabletop role-playing game of personal and political horror in which players
  portray vampires navigating hunger, morality, clan identity, and supernatural society. Published by White Wolf,
  it became the flagship game of the World of Darkness setting.
wikipedia: https://en.wikipedia.org/wiki/Vampire:_The_Masquerade
website: https://www.worldofdarkness.com/vampire-the-masquerade
designers:
  - Mark Rein-Hagen
publishers:
  - White Wolf Publishing
publication: 1991
genres:
  - tabletop role-playing game
  - horror
  - urban fantasy
  - World of Darkness
