name: "Brass: Birmingham"
description: >
  Brass: Birmingham is an economic strategy board game about building industries, canals, rails, and trade networks in England's Industrial Revolution.
  A standalone successor to Brass, it is widely regarded as one of the strongest heavy strategy games of its era.
