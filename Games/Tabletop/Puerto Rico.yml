name: Puerto Rico
description: >
  Puerto Rico is a Eurogame in which players choose role actions to develop plantations, produce goods, ship exports, and build an efficient colonial economy.
  Its role-selection mechanism made it one of the defining strategy board games of the early 2000s.
wikipedia: https://en.wikipedia.org/wiki/Puerto_Rico_(board_game)
designers:
  - Andreas Seyfarth
publishers:
  - Alea
  - Ravensburger
  - Rio Grande Games
publication: 2002
genres:
  - strategy
  - eurogame
  - role selection
  - resource management
  - board game
