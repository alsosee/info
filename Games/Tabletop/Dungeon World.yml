name: Dungeon World
description: >
  Dungeon World is a fantasy tabletop role-playing game that applies Powered by the Apocalypse design to dungeon-crawling adventure.
  It combines familiar fantasy classes with player-facing moves, bonds, fronts, and fiction-first resolution.
wikipedia: https://en.wikipedia.org/wiki/Dungeon_World
website: https://dungeon-world.com
designers:
  - Sage LaTorra
  - Adam Koebel
publishers:
  - Sage Kobold Productions
publication: 2012
genres:
  - tabletop role-playing game
  - fantasy
  - dungeon crawl
  - Powered by the Apocalypse
