name: Fiasco
description: >
  Fiasco is a GM-less tabletop role-playing game about ordinary people with poor impulse control pursuing disastrous ambitions.
  Its playset-driven structure, scene framing, and tilt/aftermath procedures made it a landmark indie RPG.
wikipedia: https://en.wikipedia.org/wiki/Fiasco_(role-playing_game)
website: https://bullypulpitgames.com/products/fiasco
designers:
  - Jason Morningstar
publishers:
  - Bully Pulpit Games
publication: 2009
genres:
  - tabletop role-playing game
  - storytelling game
  - GM-less
  - indie RPG
