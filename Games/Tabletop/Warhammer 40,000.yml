name: "Warhammer 40,000"
description: >
  Warhammer 40,000 is a science-fantasy miniature wargame in which players assemble armies of models and fight tabletop battles in a dystopian far-future setting.
  Produced by Games Workshop since 1987, it is one of the most prominent miniature wargame settings and hobby systems.
