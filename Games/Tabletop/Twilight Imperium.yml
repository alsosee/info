name: Twilight Imperium
description: >
  Twilight Imperium is an epic space-opera strategy board game in which alien civilizations pursue military,
  political, technological, and diplomatic control of the galaxy. Created by Christian T. Petersen for Fantasy
  Flight Games, it became a landmark long-form hobby board game.
