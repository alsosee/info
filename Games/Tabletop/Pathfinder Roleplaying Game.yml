name: Pathfinder Roleplaying Game
description: >
  Pathfinder Roleplaying Game is a fantasy tabletop role-playing game derived from the Open Game License and the
  3.5 edition rules tradition of Dungeons & Dragons. Designed by Jason Bulmahn and published by Paizo, it became a
  major alternative fantasy RPG line.
