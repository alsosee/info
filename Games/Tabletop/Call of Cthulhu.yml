name: Call of Cthulhu
description: >
  Call of Cthulhu is a horror tabletop role-playing game based on the Cthulhu Mythos, with investigators
  confronting occult mysteries, cosmic entities, and psychological strain. Designed by Sandy Petersen and
  published by Chaosium, it became one of the foundational horror RPGs.
wikipedia: https://en.wikipedia.org/wiki/Call_of_Cthulhu_(role-playing_game)
website: https://www.chaosium.com/call-of-cthulhu-rpg/
designers:
  - Sandy Petersen
publishers:
  - Chaosium
publication: 1981
genres:
  - tabletop role-playing game
  - horror
  - investigation
  - Cthulhu Mythos
