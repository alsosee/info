name: Gloomhaven
description: >
  Gloomhaven is a cooperative campaign board game in which players control mercenaries through linked tactical dungeon scenarios and persistent character progression.
  Designed by Isaac Childres and published by Cephalofair Games, it became a landmark heavyweight hobby board game after its 2017 release.
