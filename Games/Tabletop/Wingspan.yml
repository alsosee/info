name: Wingspan
description: >
  Wingspan is a card-driven engine-building board game in which players attract birds to habitats and build scoring combinations across rounds.
  Designed by Elizabeth Hargrave and published by Stonemaier Games, it became a major crossover hit for contemporary board games.
