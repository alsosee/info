name: Legend of the Five Rings Roleplaying Game
description: >
  Legend of the Five Rings Roleplaying Game is a fantasy tabletop RPG set in
  Rokugan, a world inspired by feudal Japan and other East Asian traditions,
  where samurai drama, court politics, spiritual duty, and clan conflict shape
  play.
