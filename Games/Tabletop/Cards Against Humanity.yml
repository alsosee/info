  - Daniel Dranove
  - Eli Halpern
  - Ben Hantoot
  - David Munk
  - David Pinsof
  - Max Temkin
  - Eliot Weinstein
publishers:
  - Cards Against Humanity LLC
publication: 2011
genres:
  - party game
  - card game
  - humor
