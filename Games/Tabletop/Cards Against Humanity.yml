name: Cards Against Humanity
description: >
  Cards Against Humanity is a party card game in which players complete prompts with answer cards, aiming for
  comic, provocative, or absurd combinations judged by a rotating player. Released as a free print-and-play game
  before commercial publication, it became a major modern party-game phenomenon.
wikipedia: https://en.wikipedia.org/wiki/Cards_Against_Humanity
website: https://www.cardsagainsthumanity.com
designers:
