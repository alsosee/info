name: Terraforming Mars
description: >
  Terraforming Mars is a strategy board game in which players develop corporations, play project cards, and raise global parameters to make Mars habitable.
  Designed by Jacob Fryxelius and first published by FryxGames, it became one of the defining heavyweight strategy games of the 2010s.
