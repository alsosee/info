name: Arkham Horror
description: >
  Arkham Horror is a cooperative adventure board game of investigators, portals, monsters, and cosmic threats inspired by H. P. Lovecraft's Cthulhu Mythos.
  Later editions by Fantasy Flight Games made it a central title in modern thematic horror board gaming.
wikipedia: https://en.wikipedia.org/wiki/Arkham_Horror
designers:
  - Richard Launius
publishers:
  - Chaosium
  - Fantasy Flight Games
publication: 1987
genres:
  - cooperative
  - adventure
  - horror
  - Cthulhu Mythos
  - board game
