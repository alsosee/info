name: Spirit Island
description: >
  Spirit Island is a cooperative strategy board game in which players control island spirits defending their land from colonizing invaders.
  Its asymmetric spirits, escalating invader system, and anti-colonial framing made it a landmark cooperative game.
wikipedia: https://en.wikipedia.org/wiki/Spirit_Island_(board_game)
designers:
  - R. Eric Reuss
publishers:
  - Greater Than Games
publication: 2017
genres:
  - cooperative
  - strategy
  - area control
  - board game
