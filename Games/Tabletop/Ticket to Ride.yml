name: Ticket to Ride
description: >
  Ticket to Ride is a railway-themed board game in which players collect train cards, claim routes, and complete destination tickets across a map.
  Designed by Alan R. Moon and published by Days of Wonder, it won the 2004 Spiel des Jahres and became a gateway title for modern board gaming.
wikipedia: https://en.wikipedia.org/wiki/Ticket_to_Ride_(board_game)
website: https://www.daysofwonder.com/ticket-to-ride
designers:
  - Alan R. Moon
publishers:
  - Days of Wonder
publication: 2004
genres:
  - set collection
  - route building
  - strategy
  - board game
