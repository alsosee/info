name: Risk
description: >
  Risk is a strategy board game of diplomacy, conflict, and conquest in which players use armies to capture territories on a world map.
  Designed by Albert Lamorisse and later published internationally by Parker Brothers, it helped popularize strategic conflict games for mass-market audiences.
wikipedia: https://en.wikipedia.org/wiki/Risk_(game)
designers:
  - Albert Lamorisse
publishers:
  - Miro Company
  - Parker Brothers
  - Hasbro
publication: 1957
genres:
  - strategy
  - wargame
  - area control
  - board game
