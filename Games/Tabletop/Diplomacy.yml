name: Diplomacy
description: >
  Diplomacy is a negotiation-focused strategy board game set in pre-World War I Europe, where players secretly
  write orders and rely on alliances, persuasion, and betrayal rather than dice. Designed by Allan B. Calhamer, it
  became one of the classic games of pure negotiation.
wikipedia: https://en.wikipedia.org/wiki/Diplomacy_(game)
designers:
  - Allan B. Calhamer
publishers:
  - Games Research
  - Avalon Hill
  - Hasbro
publication: 1959
genres:
  - strategy
  - negotiation
  - war game
  - board game
