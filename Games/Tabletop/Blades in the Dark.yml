name: Blades in the Dark
description: >
  Blades in the Dark is a tabletop role-playing game about a crew of criminals operating in the haunted industrial
  city of Doskvol. Its flashback, stress, position, and effect systems helped define the Forged in the Dark family
  of narrative games.
wikipedia: https://en.wikipedia.org/wiki/Blades_in_the_Dark
website: https://bladesinthedark.com
designers:
  - John Harper
publishers:
  - Evil Hat Productions
publication: 2017
genres:
  - tabletop role-playing game
  - fantasy
  - crime
  - Forged in the Dark
