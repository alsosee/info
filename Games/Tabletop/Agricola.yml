name: Agricola
description: >
  Agricola is a worker-placement farming game in which players expand a household, cultivate fields, raise animals, and balance long-term development against food pressure.
  It became one of Uwe Rosenberg's most influential heavy Eurogames.
wikipedia: https://en.wikipedia.org/wiki/Agricola_(board_game)
designers:
  - Uwe Rosenberg
publishers:
  - Lookout Games
  - Z-Man Games
publication: 2007
genres:
  - strategy
  - eurogame
  - worker placement
  - farming
  - board game
