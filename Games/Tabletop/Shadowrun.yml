name: Shadowrun
description: >
  Shadowrun is a cyberpunk fantasy tabletop role-playing game where megacorporations, magic, hacking, and street-level mercenary work collide.
  Its blend of cyberpunk and fantasy became one of tabletop RPGs' most recognizable settings.
wikipedia: https://en.wikipedia.org/wiki/Shadowrun
website: https://www.shadowruntabletop.com
designers:
  - Bob Charrette
  - Paul Hume
  - Tom Dowd
publishers:
  - FASA
  - Catalyst Game Labs
publication: 1989
genres:
  - tabletop role-playing game
  - cyberpunk
  - fantasy
  - science fantasy
