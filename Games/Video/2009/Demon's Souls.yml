name: Demon's Souls
description: Demon's Souls is an action role-playing game set in the cursed kingdom of Boletaria, where players face punishing combat, interconnected online systems, and repeated death as part of progression. Developed by FromSoftware, it established the template for the Soulslike subgenre.
