name: "Dragon Quest V: Hand of the Heavenly Bride"
series: Dragon Quest
description: >
  Dragon Quest V: Hand of the Heavenly Bride is a role-playing game that follows its
  protagonist across childhood, adulthood, and family life while building a party that can
  include recruited monsters. Its generational story and monster recruitment systems became
  lasting parts of the series identity.
