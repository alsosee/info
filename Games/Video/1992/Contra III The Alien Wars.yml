name: "Contra III: The Alien Wars"
series: Contra
description: >
  Contra III: The Alien Wars is a run-and-gun action game for the Super Nintendo that sends
  commandos Bill and Lance into a future war against an alien invasion. It is known for its
  intense side-scrolling stages, overhead missions, and set-piece boss fights.
