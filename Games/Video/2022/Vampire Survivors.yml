name: Vampire Survivors
description: >
  Vampire Survivors is an arcade survival game about moving through waves of monsters while
  weapons fire automatically and upgrades stack into increasingly dense builds. Its
  low-friction structure helped popularize the bullet heaven style of action roguelite.
