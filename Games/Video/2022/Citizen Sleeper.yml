name: Citizen Sleeper
description: >
  Citizen Sleeper is a tabletop-inspired narrative role-playing game about an escaped
  synthetic worker trying to survive on the space station Erlin's Eye. It uses dice-driven
  actions, clocks, and branching relationships to frame life under corporate precarity.
released: 2022-05-05
genres:
  - Role-playing (RPG)
  - Adventure
  - Indie
wikipedia: https://en.wikipedia.org/wiki/Citizen_Sleeper
igdb: https://www.igdb.com/games/citizen-sleeper
developers:
  - Jump Over the Age
publishers:
  - Fellow Traveller
