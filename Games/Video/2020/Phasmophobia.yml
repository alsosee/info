name: Phasmophobia
description: >
  Phasmophobia is a cooperative ghost-hunting horror game where players investigate haunted
  locations, gather evidence, and identify supernatural entities using equipment and voice
  interaction. Its proximity-chat tension helped make it a major streaming-era horror game.
released: 2020-09-18
genres:
