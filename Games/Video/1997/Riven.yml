name: Riven
series: Myst
description: >
  Riven is a puzzle adventure game and the sequel to Myst, set across interconnected islands
  filled with mechanical systems, languages, and environmental clues. Its detailed
  world-building and integrated puzzle design made it a landmark of CD-ROM-era adventure
  games.
released: 1997-10-31
genres:
