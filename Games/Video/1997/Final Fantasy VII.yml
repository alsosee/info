name: Final Fantasy VII
description: Final Fantasy VII is a role-playing game about Cloud Strife, a mercenary who joins the resistance group AVALANCHE in a struggle against the Shinra corporation and a larger threat to the planet. Its cinematic presentation, 3D character models, and large-scale story made it one of the defining console RPGs of the 1990s.
