name: "Castlevania: Symphony of the Night"
series: Castlevania
description: >
  Castlevania: Symphony of the Night is an action role-playing platformer about Alucard
  exploring Dracula's castle after the disappearance of Richter Belmont. Its nonlinear castle
  layout, RPG progression, and exploration structure helped define the metroidvania form.
