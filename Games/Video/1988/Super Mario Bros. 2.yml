name: Super Mario Bros. 2
description: >
  Super Mario Bros. 2 is a side-scrolling platform game in which Mario, Luigi, Princess Peach, and Toad travel through the dream world of Subcon. Its character-specific abilities and object-throwing mechanics set it apart from the rest of the early Super Mario series.
