name: Snatcher
description: >
  Snatcher is Hideo Kojima's cyberpunk adventure game about an amnesiac
  investigator hunting bio-android impostors, blending visual-novel scenes,
  detective menus, and shooting sequences with noir and science-fiction
  influences.
