name: "Pokémon Diamond and Pearl"
description: >
  Pokémon Diamond and Pearl are paired Nintendo DS role-playing games set in Sinnoh, adding online trading and battling, a split between physical and special moves, and a new generation of Pokémon. They marked the main series' move to Nintendo DS.
