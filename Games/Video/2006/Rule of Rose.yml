name: Rule of Rose
description: >
  Rule of Rose is a psychological survival horror game set around an orphanage, a zeppelin,
  and a cruel hierarchy of children. Its disturbing fairy-tale imagery and controversial
  release history made it one of the PlayStation 2 era's most discussed horror games.
released: 2006-01-19
genres:
