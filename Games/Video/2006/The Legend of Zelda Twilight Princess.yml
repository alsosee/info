name: "The Legend of Zelda: Twilight Princess"
description: >
  The Legend of Zelda: Twilight Princess is an action-adventure game in which Link moves between Hyrule and a shadowed Twilight Realm, shifting between human and wolf forms. Its darker tone and large-scale dungeons made it a major late GameCube and Wii-era Zelda entry.
