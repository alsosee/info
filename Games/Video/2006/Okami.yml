name: Ōkami
description: Ōkami is an action-adventure game inspired by Japanese folklore, casting the player as the sun goddess Amaterasu in wolf form. Its sumi-e-inspired visual style and Celestial Brush mechanics made it one of Clover Studio’s signature works.
