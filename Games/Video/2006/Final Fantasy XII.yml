name: Final Fantasy XII
series: Final Fantasy
description: >
  Final Fantasy XII is a role-playing game set in Ivalice, where political conflict draws a
  group of adventurers into the struggle between empires. Its open-field exploration, Gambit
  automation system, and MMO-influenced combat marked a major systems shift for the series.
released: 2006-03-16
