name: "Ultima IV: Quest of the Avatar"
description: >
  Ultima IV: Quest of the Avatar is a role-playing game that shifts the series from defeating a single villain toward pursuing moral virtues and becoming the Avatar. Its virtue system and open-world structure made it a landmark in computer RPG design.
