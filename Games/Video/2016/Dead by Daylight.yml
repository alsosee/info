name: Dead by Daylight
description: >
  Dead by Daylight is an asymmetric multiplayer horror game in which one player controls a
  killer while four survivors repair generators and try to escape. Its mix of original killers
  and licensed horror icons made it a long-running live-service horror game.
released: 2016-06-14
genres:
  - Strategy
  - Survival horror
wikipedia: https://en.wikipedia.org/wiki/Dead_by_Daylight
