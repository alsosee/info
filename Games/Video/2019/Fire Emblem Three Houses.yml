name: "Fire Emblem: Three Houses"
series: Fire Emblem
description: >
  Fire Emblem: Three Houses is a tactical role-playing game set at Garreg Mach Monastery,
  where the player teaches one of three student houses before political conflict reshapes the
  continent of Fodlan. It combines school life systems, character relationships, and tactical
  strategy battles.
released: 2019-07-26
genres:
  - Role-playing (RPG)
  - Strategy
  - Turn-based strategy (TBS)
  - Tactical
wikipedia: https://en.wikipedia.org/wiki/Fire_Emblem:_Three_Houses
igdb: https://www.igdb.com/games/fire-emblem-three-houses
developers:
  - Intelligent Systems
  - Koei Tecmo
publishers:
  - Nintendo
