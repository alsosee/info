name: Maniac Mansion
description: >
  Maniac Mansion is a graphic adventure game in which players control a group of teenagers exploring a strange mansion to rescue a friend. Developed by Lucasfilm Games, it introduced the SCUMM engine and helped define point-and-click adventure design.
