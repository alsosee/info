name: Double Dragon
description: >
  Double Dragon is a side-scrolling beat ’em up in which martial-artist brothers Billy and Jimmy Lee fight through street gangs to rescue Marian. Developed by Technōs Japan, it became one of the key templates for cooperative arcade brawlers.
