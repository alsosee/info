name: "The Legend of Zelda: Phantom Hourglass"
description: >
  The Legend of Zelda: Phantom Hourglass is a Nintendo DS action-adventure sequel to The Wind Waker, using touch-screen controls and cel-shaded presentation. Its sailing, central dungeon, and stylus-driven puzzles adapted Zelda design to the DS.
