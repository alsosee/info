  - "puzzle"
  - "adventure"
wikipedia: "https://en.wikipedia.org/wiki/Shadow_of_the_Colossus"
igdb: "https://www.igdb.com/games/shadow-of-the-colossus"
developers:
  - "Team Ico"
publishers:
  - "Sony Computer Entertainment"
