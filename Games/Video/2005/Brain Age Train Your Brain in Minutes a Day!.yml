name: "Brain Age: Train Your Brain in Minutes a Day!"
description: >
  Brain Age: Train Your Brain in Minutes a Day! is a Nintendo DS puzzle and training game built around short mental exercises, math problems, reading tasks, and Sudoku. Its touch-screen format and daily routine design helped define the DS's expanded-audience strategy.
