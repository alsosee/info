name: Rise of Nations
description: >
  Rise of Nations is a real-time strategy game that blends territorial expansion, city
  building, resource management, and historical era advancement. Its national borders and
  broad timeline give it a structure that sits between classic RTS design and
  Civilization-style strategy.
released: 2003-05-20
genres:
  - Real Time Strategy (RTS)
  - Strategy
