name: "Mario Kart: Double Dash!!"
description: >
  Mario Kart: Double Dash!! is a GameCube kart racing game that places two characters in each kart, allowing them to swap roles and use character-specific special items. Its team mechanic and local multiplayer made it one of the most distinct Mario Kart entries.
