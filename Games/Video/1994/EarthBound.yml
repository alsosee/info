name: EarthBound
description: EarthBound is a role-playing game about a group of children traveling through a surreal version of contemporary suburbia to confront an alien threat. Its offbeat humor, modern setting, and emotional tone made it a cult classic and a major influence on later indie RPGs.
released: '1994-08-27'
genres:
- Role-playing (RPG)
- Turn-based strategy (TBS)
- Adventure
