name: Theme Park
description: >
  Theme Park is a business simulation game about designing and managing an amusement park.
  Players build rides and shops, set prices, manage staff, and balance guest happiness against
  the economics of a growing park.
released: 1994-01-02
genres:
  - Real Time Strategy (RTS)
  - Simulator
  - Strategy
