name: Donkey Kong Country
description: Donkey Kong Country is a side-scrolling platform game starring Donkey Kong and Diddy Kong as they recover stolen bananas from King K. Rool. Developed by Rare, it became known for its pre-rendered 3D-style graphics and helped define late-era Super Nintendo platforming.
