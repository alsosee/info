name: Kentucky Route Zero
description: >
  Kentucky Route Zero is an episodic magical realist adventure about a delivery driver, an
  antique shop, and a mysterious underground highway in Kentucky. Its theatrical presentation,
  fragmented structure, and literary tone made it a defining narrative game of the 2010s.
released: 2013-01-07
genres:
  - Point-and-click
  - Adventure
  - Indie
