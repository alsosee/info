name: Super Mario 3D World
description: >
  Super Mario 3D World is a Wii U platform game that expands Super Mario 3D Land's compact 3D-stage structure with four-player co-op, character differences, and the Cat Suit. It bridges 2D Mario clarity with 3D Mario movement.
