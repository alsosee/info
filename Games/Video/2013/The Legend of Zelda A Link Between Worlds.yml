name: "The Legend of Zelda: A Link Between Worlds"
description: >
  The Legend of Zelda: A Link Between Worlds is a Nintendo 3DS action-adventure game set in a version of Hyrule connected to A Link to the Past. Its wall-merging mechanic and flexible dungeon order gave the classic top-down Zelda formula a modern structure.
