name: Little Nightmares
series: Little Nightmares
description: >
  Little Nightmares is a puzzle-platform horror game about a small child named Six escaping
  the Maw, a grotesque vessel filled with distorted adults and industrial spaces. Its wordless
  storytelling and miniature scale give it a distinctive dark-fairy-tale tone.
released: 2017-04-28
