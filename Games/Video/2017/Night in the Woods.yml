name: Night in the Woods
description: >
  Night in the Woods is a narrative adventure about Mae Borowski returning to her declining
  hometown of Possum Springs and reconnecting with friends. It combines exploration, dialogue,
  small-town mystery, and themes of work, identity, and mental health.
