name: Mario Kart 8 Deluxe
description: >
  Mario Kart 8 Deluxe is a Nintendo Switch expanded version of Mario Kart 8, adding all Wii U DLC, revised battle mode, new racers, and portability. It became one of the Switch's central multiplayer games and one of Nintendo's best-selling releases.
