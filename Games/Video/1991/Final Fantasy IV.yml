name: Final Fantasy IV
series: Final Fantasy
description: >
  Final Fantasy IV is a role-playing game about Cecil Harvey, a dark knight who turns against
  the kingdom of Baron and joins a party of allies in a struggle involving crystals, airships,
  and a looming planetary threat. It helped define the character-driven style of the Super
  Nintendo-era Final Fantasy games.
released: 1991-07-19
genres:
