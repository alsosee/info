description: >
  Monkey Island 2: LeChuck's Revenge is a point-and-click adventure following Guybrush
  Threepwood as he searches for the treasure of Big Whoop while his undead rival LeChuck
  returns. It expands the original game with denser puzzles, sharper comedy, and a larger
  island-hopping structure.
