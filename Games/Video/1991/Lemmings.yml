name: Lemmings
description: >
  Lemmings is a puzzle game in which players assign limited skills to a stream of small creatures to guide enough of them safely through hazardous levels. Developed by DMA Design, it became one of the defining puzzle games of the early 1990s.
released: 1991-02-14
genres:
  - Puzzle
