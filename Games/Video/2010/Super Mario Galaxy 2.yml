name: Super Mario Galaxy 2
description: >
  Super Mario Galaxy 2 is a 3D platform game that expands the planet-hopping structure of Super Mario Galaxy with new power-ups, denser challenges, and Yoshi-focused stages. It is widely regarded as one of the peak examples of Nintendo's 3D platform design.
