name: "Pokémon Black and White"
description: >
  Pokémon Black and White are paired Nintendo DS role-playing games set in Unova, introducing a new regional Pokédex, animated battle sprites, seasons, and a more story-forward conflict with Team Plasma. They served as the main fifth-generation Pokémon releases.
