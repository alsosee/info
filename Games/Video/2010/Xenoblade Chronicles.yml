name: Xenoblade Chronicles
series: Xenoblade Chronicles
description: >
  Xenoblade Chronicles is an action role-playing game set on the bodies of two ancient titans,
  where Shulk and his companions use the Monado to fight mechanical invaders and uncover the
  world's history. Its large open areas and real-time battle system helped establish a major
  Nintendo RPG series.
released: 2010-06-10
genres:
  - Role-playing (RPG)
  - Adventure
