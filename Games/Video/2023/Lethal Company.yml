name: Lethal Company
description: >
  Lethal Company is a cooperative horror game about scavenging abandoned moons for scrap under
  a corporate quota while avoiding monsters and environmental hazards. Its proximity chat,
  slapstick danger, and social tension made it a breakout multiplayer horror game.
