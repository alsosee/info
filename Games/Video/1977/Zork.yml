name: Zork
description: >
  Zork is an interactive fiction adventure game in which players explore the Great Underground Empire through typed commands and puzzle solving. Originating on mainframe computers before Infocom’s commercial releases, it became one of the defining text adventures.
released: 1977-06-01
genres:
  - Adventure
