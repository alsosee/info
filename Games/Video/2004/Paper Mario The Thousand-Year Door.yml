name: "Paper Mario: The Thousand-Year Door"
description: >
  Paper Mario: The Thousand-Year Door is a role-playing game for GameCube that sends paper Mario through Rogueport and a series of theatrical chapter-based quests. Its turn-based combat, partners, writing, and paper mechanics made it a high point of the Paper Mario series.
