name: "The Legend of Zelda: The Minish Cap"
description: >
  The Legend of Zelda: The Minish Cap is a top-down action-adventure game centered on Link's ability to shrink to the size of the tiny Minish people. Developed with Capcom, it expands the Four Swords branch of the Zelda series with compact dungeons and size-changing puzzles.
