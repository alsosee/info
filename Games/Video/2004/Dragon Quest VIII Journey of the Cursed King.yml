name: "Dragon Quest VIII: Journey of the Cursed King"
series: Dragon Quest
description: >
  Dragon Quest VIII: Journey of the Cursed King is a role-playing game about a royal guard and
  his companions seeking to break a curse placed on the kingdom of Trodain. It brought the
  series into a large cel-shaded 3D world while preserving its traditional turn-based
  structure.
released: 2004-11-27
genres:
