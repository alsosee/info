name: "Metroid: Zero Mission"
description: >
  Metroid: Zero Mission is a Game Boy Advance reimagining of the original Metroid, rebuilding Samus Aran's first mission with modern controls, expanded areas, and new story material. It became a key example of how to remake an early console classic while preserving its exploratory core.
