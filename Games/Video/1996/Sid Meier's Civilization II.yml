name: "Sid Meier's Civilization II"
description: >
  Sid Meier's Civilization II is a turn-based 4X strategy game in which players guide a civilization from antiquity into the future through exploration, research, diplomacy, warfare, and city development. It expanded the first Civilization with an isometric presentation and deeper systems.
