name: PaRappa the Rapper
description: >
  PaRappa the Rapper is a rhythm game in which players repeat rap phrases through call-and-response stages starring a paper-thin dog trying to prove himself. Its music, visual style, and timing mechanics helped define the modern rhythm-game genre.
released: 1996-12-06
genres:
  - Music
