name: Inscryption
description: >
  Inscryption is a deck-building horror game that mixes card battles, escape-room puzzles, and
  metafictional narrative shifts. Designed by Daniel Mullins, it became known for turning
  familiar roguelike card mechanics into an unsettling story structure.
released: 2021-10-19
genres:
