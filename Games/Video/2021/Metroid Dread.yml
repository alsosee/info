name: Metroid Dread
description: >
  Metroid Dread is a 2D action-adventure game in which Samus Aran investigates planet ZDR while evading the relentless E.M.M.I. robots. It revived a long-dormant project and brought the main 2D Metroid storyline to the Nintendo Switch era.
