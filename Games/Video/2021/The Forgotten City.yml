name: The Forgotten City
description: >
  The Forgotten City is a narrative adventure about a Roman city trapped under a supernatural
  law that punishes every citizen for one person's crime. Expanded from a Skyrim mod, it
  centers on investigation, dialogue, moral choices, and time-loop structure.
released: 2021-07-28
genres:
  - Role-playing (RPG)
  - Adventure
  - Indie
wikipedia: https://en.wikipedia.org/wiki/The_Forgotten_City
igdb: https://www.igdb.com/games/the-forgotten-city
developers:
  - Modern Storyteller
publishers:
  - Dear Villagers
