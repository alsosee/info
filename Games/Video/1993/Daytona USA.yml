name: Daytona USA
description: >
  Daytona USA is an arcade racing game known for high-speed stock-car racing, linked cabinets, bright 3D visuals, and an energetic soundtrack. Developed by Sega AM2, it became one of the signature 3D arcade racers of the 1990s.
released: 1993-08-01
