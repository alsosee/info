name: Day of the Tentacle
description: >
  Day of the Tentacle is a point-and-click adventure game about three friends using a
  malfunctioning time machine to stop Purple Tentacle from taking over the world. Its
  time-travel puzzle structure and cartoon presentation made it one of LucasArts classic
  adventures.
released: 1993-06-25
genres:
  - Point-and-click
  - Adventure
