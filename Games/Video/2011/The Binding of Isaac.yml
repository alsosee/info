name: The Binding of Isaac
description: >
  The Binding of Isaac is a roguelike shooter about a child escaping into a basement filled
  with grotesque monsters, power-ups, and randomly generated rooms. Edmund McMillen and
  Florian Himsl's game helped push roguelike structure into indie action design.
released: 2011-09-28
genres:
  - Shooter
  - Role-playing (RPG)
  - Adventure
  - Indie
wikipedia: https://en.wikipedia.org/wiki/The_Binding_of_Isaac_(video_game)
igdb: https://www.igdb.com/games/the-binding-of-isaac
developers:
  - Edmund McMillen
  - Florian Himsl
publishers:
  - Edmund McMillen
