name: Dragon Age II
description: >
  Dragon Age II is a fantasy role-playing game following Hawke's rise in the city of Kirkwall across a decade of political and social conflict. Its framed narrative, reused urban setting, and faster combat marked a sharp shift from Dragon Age: Origins.
