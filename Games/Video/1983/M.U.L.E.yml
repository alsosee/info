name: "M.U.L.E."
description: >
  M.U.L.E. is a multiplayer economic strategy game about colonists producing, trading, and competing for resources on a developing planet. Designed by Dani Bunten and Ozark Softscape, it became a landmark for social strategy and multiplayer game design.
