name: "Dragon's Lair"
description: >
  Dragon's Lair is an animated arcade game in which players guide Dirk the Daring through timed action prompts inside a hand-drawn fantasy adventure. Its laserdisc animation by Don Bluth made it one of the most visually distinctive arcade games of the 1980s.
