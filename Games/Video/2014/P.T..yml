name: P.T.
description: >
  P.T. is Kojima Productions' first-person psychological horror teaser for the
  cancelled Silent Hills project, built around a looping hallway, environmental
  clues, and opaque puzzle triggers.
released: 2014-08-12
series: Silent Hill
genres:
