name: Fallout 4
description: >
  Fallout 4 is an open-world action role-playing game set in the post-apocalyptic Commonwealth around Boston. It expands Bethesda's Fallout formula with voiced dialogue, settlement building, weapon customization, and a stronger real-time combat focus.
