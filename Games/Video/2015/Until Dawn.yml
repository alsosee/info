name: Until Dawn
description: >
  Until Dawn is an interactive horror drama about eight friends trapped at a mountain lodge
  where player choices shape who survives the night. It uses cinematic branching, quick-time
  events, and slasher-film structure to build a choice-driven horror story.
released: 2015-08-25
genres:
  - Adventure
  - Survival horror
wikipedia: https://en.wikipedia.org/wiki/Until_Dawn
igdb: https://www.igdb.com/games/until-dawn
developers:
  - Supermassive Games
publishers:
  - Sony Computer Entertainment
