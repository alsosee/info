name: Soma
description: >
  Soma is a science-fiction horror game set in the underwater PATHOS-II facility, where
  questions of consciousness and identity unfold through exploration and encounters with
  hostile machines. It extends Frictional Games' first-person horror design into philosophical
  science fiction.
released: 2015-09-21
genres:
  - Puzzle
  - Adventure
  - Indie
  - Survival horror
