name: Life Is Strange
description: >
  Life Is Strange is an episodic adventure game about photography student Max Caulfield, whose ability to rewind time shapes conversations, puzzles, and branching consequences. Its teen drama framing and choice-focused storytelling made it a key narrative game of the 2010s.
