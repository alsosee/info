name: Return of the Obra Dinn
description: >
  Return of the Obra Dinn is a first-person mystery game in which an insurance investigator reconstructs the fate of a missing merchant ship using a supernatural pocket watch. Its deduction structure and stark monochrome presentation made it one of the decade's most acclaimed puzzle games.
