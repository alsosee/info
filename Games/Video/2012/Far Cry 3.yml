name: Far Cry 3
description: >
  Far Cry 3 is an open-world first-person shooter set on a violent tropical archipelago, blending outpost capture, hunting, crafting, and story missions. Its villain Vaas and systemic island structure became a template for later Ubisoft open-world games.
