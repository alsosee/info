name: "Fire Emblem: Awakening"
description: >
  Fire Emblem: Awakening is a tactical role-playing game that follows Chrom, Robin, and their allies through grid-based battles and character-driven support systems. It revitalized the Fire Emblem series internationally with accessible difficulty options and a strong emphasis on relationships and unit growth.
