name: "FTL: Faster Than Light"
description: >
  FTL: Faster Than Light is a roguelike spaceship-management game in which players command a fleeing starship through randomized sectors, balancing crew, power, weapons, and survival choices. Its compact run structure and systemic encounters made it a landmark modern indie strategy game.
