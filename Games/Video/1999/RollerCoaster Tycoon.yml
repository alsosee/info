name: RollerCoaster Tycoon
description: >
  RollerCoaster Tycoon is a theme-park management simulation in which players design roller coasters, build attractions, manage guests, and meet scenario goals. Created by Chris Sawyer, it became one of the signature PC simulation games of the late 1990s.
