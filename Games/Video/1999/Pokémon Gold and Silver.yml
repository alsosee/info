name: "Pokémon Gold and Silver"
description: >
  Pokémon Gold and Silver are paired role-playing games set in the Johto region, adding 100 new Pokémon, breeding, held items, day-night cycles, and a return to Kanto. They expanded the original formula into one of the series' most ambitious handheld sequels.
