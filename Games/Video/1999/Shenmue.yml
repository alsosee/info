name: Shenmue
description: >
  Shenmue is an open-world adventure game following Ryo Hazuki through detailed Japanese environments as he investigates his father’s death. Directed by Yu Suzuki, it combined daily schedules, exploration, martial arts, and cinematic storytelling on an unusually large scale.
