name: Grim Fandango
description: >
  Grim Fandango is a graphic adventure game set in the Land of the Dead, blending film noir, Mexican folklore, and puzzle-driven exploration. Written and directed by Tim Schafer at LucasArts, it became one of the studio’s most acclaimed adventures.
