name: Soulcalibur
series: Soulcalibur
description: >
  Soulcalibur is a weapon-based fighting game that refined the 3D combat of Soul Edge with
  fluid movement, an eight-way run system, and responsive arcade pacing. Its Dreamcast version
  became one of the most acclaimed console fighting games of its era.
