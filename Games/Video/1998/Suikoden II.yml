name: Suikoden II
series: Suikoden
description: >
  Suikoden II is a role-playing game about two childhood friends caught on opposite sides of a
  war between the City-States of Jowston and the Highland Kingdom. It is known for its
  political story, castle-building systems, and recruitable cast of 108 Stars of Destiny.
