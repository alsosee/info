name: "Donkey Kong Country 2: Diddy's Kong Quest"
description: >
  Donkey Kong Country 2: Diddy's Kong Quest is a side-scrolling platform game starring Diddy Kong and Dixie Kong as they travel through Crocodile Isle to rescue Donkey Kong. Rare's sequel expanded the original's visual style, level variety, and challenge into one of the Super Nintendo's signature platformers.
