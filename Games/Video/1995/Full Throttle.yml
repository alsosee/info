name: Full Throttle
description: >
  Full Throttle is a cinematic point-and-click adventure about Ben, leader of a biker gang,
  who becomes entangled in corporate sabotage and murder. Directed by Tim Schafer, it blends
  road-movie atmosphere, action sequences, and compact adventure-game pacing.
