name: Clock Tower
series: Clock Tower
description: >
  Clock Tower is a point-and-click survival horror game about Jennifer Simpson fleeing the
  Scissorman inside a remote mansion. Its stalker-based tension, limited defenses, and
  cinematic horror influences helped shape later horror adventure games.
