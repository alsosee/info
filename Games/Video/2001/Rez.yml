name: Rez
description: >
  Rez is a rail shooter and music game about hacking through abstract cyberspace while player
  actions layer sounds into the soundtrack. Its synesthetic audiovisual design made it one of
  Tetsuya Mizuguchi's signature rhythm-action works.
released: 2001-11-22
genres:
  - Shooter
  - Music
