name: Ikaruga
description: >
  Ikaruga is a vertically scrolling shooter built around switching between black and white
  polarities to absorb bullets and damage enemies. Its elegant polarity system, strict
  scoring, and minimalist presentation made it one of the most celebrated modern shoot em ups.
