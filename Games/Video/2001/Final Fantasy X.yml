name: Final Fantasy X
series: Final Fantasy
description: >
  Final Fantasy X is a role-playing game about Tidus, a blitzball player who is drawn into the
  world of Spira and joins summoner Yuna on a pilgrimage to confront the creature Sin. It
  brought the series to PlayStation 2 with full 3D environments, voice acting, and the
  Conditional Turn-Based Battle system.
released: 2001-07-19
genres:
  - Role-playing (RPG)
  - Adventure
wikipedia: https://en.wikipedia.org/wiki/Final_Fantasy_X
