name: Street Fighter IV
description: >
  Street Fighter IV is a fighting game that revived the series with 3D visuals on a 2D plane, Focus Attacks, and a roster centered on Street Fighter II veterans and newcomers. It played a major role in the late-2000s fighting game revival.
