name: Fallout 3
description: >
  Fallout 3 is an open-world role-playing game that reimagines the Fallout series as a first-person post-apocalyptic wasteland across Washington, D.C. Its quest structure, player choice, and V.A.T.S. combat brought the franchise to a broad 3D audience.
