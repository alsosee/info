name: Populous
description: >
  Populous is a god game in which players reshape terrain, guide followers, and use divine powers to defeat a rival deity. Designed by Peter Molyneux at Bullfrog Productions, it helped establish the god-game and real-time strategy traditions.
released: 1989-06-05
genres:
