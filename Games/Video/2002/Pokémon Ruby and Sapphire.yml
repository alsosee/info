name: "Pokémon Ruby and Sapphire"
description: >
  Pokémon Ruby and Sapphire are paired Game Boy Advance role-playing games set in Hoenn, introducing double battles, abilities, natures, and a new generation of Pokémon. Their expanded battle systems shaped the competitive structure of later Pokémon games.
