name: Age of Mythology
series: Age of Empires
description: >
  Age of Mythology is a real-time strategy game that adapts the Age of Empires formula to
  Greek, Egyptian, and Norse mythology. Players gather resources, build settlements, train
  armies, and invoke god powers while advancing through mythological ages.
released: 2002-10-30
genres:
  - Real Time Strategy (RTS)
  - Strategy
