name: Super Mario Sunshine
description: >
  Super Mario Sunshine is a 3D platform game set on Isle Delfino, where Mario uses the water-powered F.L.U.D.D. device to clean pollution and traverse tropical stages. It followed Super Mario 64 with a more unified setting and movement built around water mechanics.
