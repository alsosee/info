name: Metroid Fusion
description: >
  Metroid Fusion is a side-scrolling action-adventure game in which Samus Aran explores the Biologic Space Laboratories station while pursued by the SA-X. Its mission structure and horror-leaning atmosphere reshaped the 2D Metroid formula for Game Boy Advance.
