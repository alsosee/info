name: Sin City
description: >
  In the crime-ridden Basin City, intersecting neo-noir stories follow violent
  outsiders, corrupt officials, private vendettas, and uneasy codes of honor.
  Frank Miller's high-contrast black-and-white artwork defines the series'
  hard-boiled style, with occasional spot color used for dramatic emphasis.
