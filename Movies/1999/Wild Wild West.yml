name: Wild Wild West
description: >
  Legless Southern inventor Dr. Arliss Loveless plans to rekindle the Civil War by
  assassinating President Ulysses S. Grant. Only two men can stop him: gunfighter James
  West and master-of-disguise and inventor Artemus Gordon. The two must team up to
  thwart Loveless' plans.
