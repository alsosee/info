name: Concussion
description: >
  A dramatic thriller based on the incredible true David vs. Goliath story of American
  immigrant Dr. Bennet Omalu, the brilliant forensic neuropathologist who made the first
  discovery of CTE, a football-related brain trauma, in a pro player and fought for the
  truth to be known. Omalu's emotional quest puts him at dangerous odds with one of the
  most powerful institutions in the world.
released: 2015-12-25
rating: PG-13
length: 2h3m
genres:
  - biographical
  - sports
  - drama
