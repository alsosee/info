name: Shark Tale
description: >
  Oscar is a small fish whose big aspirations often get him into trouble. Meanwhile,
  Lenny is a great white shark with a surprising secret that no sea creature would
  guess: He's a vegetarian. When a lie turns Oscar into an improbable hero and Lenny
  becomes an outcast, the two form an unlikely friendship.
