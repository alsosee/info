name: Spies in Disguise
description: >
  Super spy Lance Sterling and scientist Walter Beckett are almost exact opposites.
  Lance is smooth, suave and debonair. Walter is… not. But what Walter lacks in social
  skills he makes up for in smarts and invention, creating the awesome gadgets Lance
  uses on his epic missions. But when events take an unexpected turn, Walter and Lance
  suddenly have to rely on each other in a whole new way.
