name: Gemini Man
description: >
  Henry Brogan is an elite 51-year-old assassin who's ready to call it quits after
  completing his 72nd job. His plans get turned upside down when he becomes the target
  of a mysterious operative who can seemingly predict his every move. To his horror,
  Brogan soon learns that the man who's trying to kill him is a younger, faster, cloned
  version of himself.
released: 2019-10-11
rating: PG-13
length: 1h57m
