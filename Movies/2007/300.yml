name: 300
description: >
  King Leonidas leads 300 Spartan warriors against King Xerxes and the
  overwhelming Persian army at Thermopylae. Zack Snyder's stylized adaptation of
  Frank Miller and Lynn Varley's graphic novel turns the battle into a brutal
  historical fantasy about sacrifice, defiance, and legend.
