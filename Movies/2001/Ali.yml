name: Ali
description: >
  In 1964, a brash, new pro boxer, fresh from his Olympic gold medal victory, explodes
  onto the scene: Cassius Clay. Bold and outspoken, he cuts an entirely new image for
  African Americans in sport with his proud public self-confidence and his unapologetic
  belief that he is the greatest boxer of all time. Yet at the top of his game, both
  Ali's personal and professional lives face the ultimate test.
released: 2001-12-25
rating: R
length: 2h37m
