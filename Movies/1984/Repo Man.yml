name: Repo Man
description: >
  A young Los Angeles punk is pulled into the car repossession business by a veteran repo man and becomes entangled in the hunt for a mysterious 1964 Chevrolet Malibu. The film blends science fiction, black comedy, and punk satire as rival repo men, government agents, and UFO obsessives chase the car and its otherworldly cargo.
