name: Hancock
description: >
  Hancock is a down-and-out superhero who's forced to employ a PR expert to help repair
  his image when the public grows weary of all the damage he's inflicted during his
  lifesaving heroics. The agent's idea of imprisoning the antihero to make the world
  miss him proves successful, but will Hancock stick to his new sense of purpose or slip
  back into old habits?
released: 2008-07-02
rating: PG-13
length: 1h32m
genres:
