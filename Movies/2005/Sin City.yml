name: Sin City
description: >
  In Basin City, a corrupt and violent metropolis, three hard-boiled stories
  follow a brutal avenger, a private investigator caught in an Old Town gang war,
  and an aging detective trying to protect a dancer from a powerful predator.
  Robert Rodriguez and Frank Miller translate Miller's graphic novels into a
  stylized neo-noir anthology built around vengeance, corruption, and uneasy
  codes of honor.
