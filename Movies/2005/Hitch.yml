name: Hitch
description: >
  Dating coach Alex 'Hitch' Hitchens mentors a bumbling client, Albert, who hopes to win
  the heart of the glamorous Allegra Cole. While Albert makes progress, Hitch faces his
  own romantic setbacks when proven techniques fail to work on Sara Melas, a tabloid
  reporter digging for dirt on Allegra Cole's love life. When Sara discovers Hitch's
  connection to Albert – now Allegra's boyfriend – it threatens to destroy both
  relationships.
released: 2005-02-11
rating: PG-13
length: 1h58m
genres:
  - romantic comedy
