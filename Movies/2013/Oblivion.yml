name: Oblivion
description: >
  In 2077, drone repair technician Jack Harper patrols a devastated Earth after a war with alien invaders while humanity prepares to abandon the planet.
  When he rescues a survivor from a crashed spacecraft, her arrival forces him to question his mission, his memories, and the truth about the world he serves.
